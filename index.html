<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON HAIR - Studio & Grooming</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#6366f1;--primary-dark:#4f46e5;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--bg:#f8fafc;--card:#ffffff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--sidebar-w:260px;--sidebar-collapsed:70px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%);color:#e2e8f0;font-size:14px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(99,102,241,0.3) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(236,72,153,0.2) 0%,transparent 50%)}
.lang-bn body{font-family:'Noto Sans Bengali','Inter',sans-serif}
.lang-fa body{font-family:'Vazirmatn',sans-serif}
[dir="rtl"] body{font-family:'Vazirmatn','Noto Sans Bengali','Inter',sans-serif}

/* ===== LOGIN PAGE ===== */
#loginPage{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:440px;padding:40px;border-radius:24px;background:rgba(255,255,255,0.08);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.18);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.login-logo{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,#6366f1,#ec4899);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:white;box-shadow:0 10px 30px rgba(99,102,241,0.5)}

/* ===== APP LAYOUT ===== */
.app{display:flex;height:100vh;position:relative;z-index:1}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:rgba(15,23,42,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.08);position:fixed;top:0;left:0;overflow-y:auto;overflow-x:hidden;transition:all 0.3s;z-index:100;display:flex;flex-direction:column}
[dir="rtl"] .sidebar{left:auto;right:0;border-right:none;border-left:1px solid rgba(255,255,255,0.08)}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar.collapsed .menu-text,.sidebar.collapsed .logo-text,.sidebar.collapsed .sidebar-footer-text{display:none}
.main{margin-left:var(--sidebar-w);flex:1;overflow-y:auto;overflow-x:hidden;padding:24px;transition:all 0.3s;-webkit-overflow-scrolling:touch}
[dir="rtl"] .main{margin-left:0;margin-right:var(--sidebar-w)}
.sidebar.collapsed~.main{margin-left:var(--sidebar-collapsed)}
[dir="rtl"] .sidebar.collapsed~.main{margin-left:0;margin-right:var(--sidebar-collapsed)}

.logo{padding:20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#6366f1,#ec4899);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;color:white;box-shadow:0 4px 12px rgba(99,102,241,0.4)}
.logo-text .brand{font-weight:700;font-size:14px;white-space:nowrap;color:white}
.logo-text .tagline{font-size:10px;opacity:0.7;white-space:nowrap;color:#cbd5e1}

.menu{padding:12px 8px;flex:1}
.menu-item{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:3px 6px;border-radius:12px;cursor:pointer;transition:all 0.2s;color:rgba(255,255,255,0.7);font-size:13px;font-weight:500;white-space:nowrap;user-select:none}
.menu-item:hover{background:rgba(255,255,255,0.08);color:white}
.menu-item.active{background:linear-gradient(135deg,rgba(99,102,241,0.3),rgba(236,72,153,0.3));color:white;box-shadow:0 4px 12px rgba(99,102,241,0.3);border:1px solid rgba(255,255,255,0.15)}
.menu-icon{width:20px;text-align:center;font-size:16px;flex-shrink:0}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,0.08);flex-shrink:0}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.header-title h1{font-size:24px;font-weight:700;color:white}
.header-title p{color:#94a3b8;font-size:12px;margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== CARDS & COMPONENTS ===== */
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.stat-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:18px;border-left:4px solid var(--primary);transition:all 0.3s}
[dir="rtl"] .stat-card{border-left:none;border-right:4px solid var(--primary)}
.stat-card:hover{background:rgba(255,255,255,0.1);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,0.25)}
.stat-card.purple{border-color:#8b5cf6}.stat-card.green{border-color:#10b981}
.stat-card.orange{border-color:#f59e0b}.stat-card.pink{border-color:#ec4899}
.stat-card.blue{border-color:#3b82f6}.stat-card.red{border-color:#ef4444}
.stat-label{color:#94a3b8;font-size:12px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:white}
.stat-sub{font-size:11px;color:#64748b;margin-top:4px}

.btn{padding:9px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:13px;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 4px 12px rgba(99,102,241,0.3)}
.btn-primary:hover{background:linear-gradient(135deg,#4f46e5,#7c3aed);transform:translateY(-1px)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:white}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:white}
.btn-secondary{background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.15)}
.btn-secondary:hover{background:rgba(255,255,255,0.15)}
.btn-ghost{background:transparent;color:#94a3b8;border:1px solid rgba(255,255,255,0.1)}
.btn-ghost:hover{background:rgba(255,255,255,0.05);color:white}
.btn-sm{padding:6px 10px;font-size:11px}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center}
.btn-block{width:100%;justify-content:center;padding:12px}

.form-group{margin-bottom:14px}
.form-label{display:block;margin-bottom:5px;font-weight:500;font-size:13px;color:#cbd5e1}
.form-control{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;font-size:13px;transition:all 0.2s;background:rgba(255,255,255,0.06);color:white;font-family:inherit}
.form-control:focus{outline:none;border-color:var(--primary);background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px rgba(99,102,241,0.2)}
.form-control::placeholder{color:#64748b}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:70px}
option{background:#1e293b;color:white}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:600px}
th{background:rgba(255,255,255,0.08);padding:12px;text-align:left;font-weight:600;font-size:12px;color:#94a3b8;border-bottom:2px solid rgba(255,255,255,0.1);white-space:nowrap}
[dir="rtl"] th{text-align:right}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;color:#e2e8f0}
tr:hover td{background:rgba(255,255,255,0.04)}

.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
.badge-success{background:rgba(16,185,129,0.2);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3)}
.badge-warning{background:rgba(245,158,11,0.2);color:#fcd34d;border:1px solid rgba(245,158,11,0.3)}
.badge-danger{background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.badge-info{background:rgba(59,130,246,0.2);color:#93c5fd;border:1px solid rgba(59,130,246,0.3)}
.badge-purple{background:rgba(139,92,246,0.2);color:#c4b5fd;border:1px solid rgba(139,92,246,0.3)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(8px)}
.modal-overlay.active{display:flex}
.modal{background:rgba(30,41,59,0.95);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:28px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal-lg{max-width:900px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.1)}
.modal-title{font-size:20px;font-weight:700;color:white}
.modal-close{background:none;border:none;font-size:28px;cursor:pointer;color:#94a3b8;padding:0 4px;line-height:1}
.modal-close:hover{color:white}

.lang-select{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:white;font-size:12px;cursor:pointer;font-family:inherit}
.lang-select option{background:#1e293b}

.page{display:none}.page.active{display:block}

.alert{padding:12px 16px;border-radius:12px;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideIn 0.3s}
.alert-success{background:rgba(16,185,129,0.15);color:#6ee7b7;border:1px solid rgba(16,185,129,0.3)}
.alert-danger{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.alert-warning{background:rgba(245,158,11,0.15);color:#fcd34d;border:1px solid rgba(245,158,11,0.3)}
.alert-info{background:rgba(59,130,246,0.15);color:#93c5fd;border:1px solid rgba(59,130,246,0.3)}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

.welcome-banner{background:linear-gradient(135deg,rgba(99,102,241,0.3),rgba(236,72,153,0.3));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.welcome-banner h2{font-size:26px;font-weight:700;color:white;margin-bottom:4px}
.welcome-banner p{opacity:0.9;font-size:14px;color:#e2e8f0}
.welcome-time{text-align:right}
.welcome-time .time{font-size:36px;font-weight:700;color:white}
.welcome-time .date{opacity:0.9;font-size:13px;color:#cbd5e1}

.user-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}

.quick-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid rgba(255,255,255,0.06);transition:background 0.2s}
.quick-item:hover{background:rgba(255,255,255,0.04)}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}
.sidebar-overlay.active{display:block}

.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-center{text-align:center}
.hidden{display:none!important}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w)!important}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .main{margin-left:0!important;padding:12px}
  [dir="rtl"] .main{margin-right:0!important}
  .sidebar.collapsed~.main{margin-left:0!important}
  [dir="rtl"] .sidebar.collapsed~.main{margin-right:0!important}
  .header-title h1{font-size:18px}
  .stat-value{font-size:20px}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .modal{padding:16px;max-height:95vh}
  table{min-width:500px}
  .welcome-banner{flex-direction:column;text-align:center}
  .welcome-time .time{font-size:28px}
}
@media(max-width:480px){.grid-4{grid-template-columns:1fr 1fr}.header-actions{width:100%;justify-content:flex-end}}
@media print{.sidebar,.header-actions,.no-print,.sidebar-overlay{display:none!important}.main{margin:0!important;padding:0!important;overflow:visible}body{overflow:visible;height:auto;background:white}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.02)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.25)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page.active{animation:fadeIn 0.3s ease}
</style>
</head>
<body>

<!-- ==================== LOGIN PAGE ==================== -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">IH</div>
    <h1 style="text-align:center;color:white;font-size:24px;font-weight:700;margin-bottom:4px">ICON HAIR</h1>
    <p style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:28px">Studio & Grooming Management</p>
    
    <div id="loginAlert" class="hidden" style="margin-bottom:16px"></div>
    
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">👤 Username</label>
        <input type="text" id="loginUser" class="form-control" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">🔒 Password</label>
        <input type="password" id="loginPass" class="form-control" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">🔐 Sign In</button>
    </form>
    
    <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
      <button onclick="demoLogin()" class="btn btn-success btn-block">⚡ Demo Login (admin/admin)</button>
      <button onclick="resetSystem()" class="btn btn-ghost btn-block">🔄 Reset System (Clear All Data)</button>
    </div>
    
    <div style="text-align:center;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:#64748b">
      <div>Default credentials: <strong style="color:#94a3b8">admin / admin</strong></div>
      <div id="userCount" style="margin-top:4px"></div>
    </div>
  </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="appContainer" class="app hidden">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">IH</div>
      <div class="logo-text">
        <div class="brand">ICON HAIR</div>
        <div class="tagline" data-i18n="tagline">Studio & Grooming</div>
      </div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="sidebar-footer">
      <div class="menu-item" onclick="showUserProfile()" style="background:rgba(255,255,255,0.05)">
        <div class="user-avatar" id="sidebarAvatar" style="width:28px;height:28px;font-size:12px">A</div>
        <div class="menu-text" id="sidebarUserName" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">Admin</div>
      </div>
      <button class="menu-item" onclick="toggleSidebar()" style="width:100%;background:rgba(255,255,255,0.05)">
        <span class="menu-icon">☰</span><span class="menu-text sidebar-footer-text">Collapse</span>
      </button>
      <button class="menu-item" onclick="logout()" style="width:100%;background:rgba(239,68,68,0.15);color:#fca5a5">
        <span class="menu-icon">🚪</span><span class="menu-text sidebar-footer-text">Logout</span>
      </button>
    </div>
  </aside>
  <main class="main" id="mainContent">
    <div class="header">
      <div class="header-title">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn btn-icon btn-secondary no-print" onclick="toggleMobileSidebar()" id="mobileMenuBtn" style="display:none">☰</button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageSubtitle">Business overview & insights</p>
          </div>
        </div>
      </div>
      <div class="header-actions no-print">
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
          <option value="en">🇬🇧 English</option>
          <option value="bn">🇧🇩 বাংলা</option>
          <option value="fa">🇮🇷 فارسی</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="exportData()">💾 Backup</button>
      </div>
    </div>
    <div id="alertArea"></div>
    <div id="pageContainer"></div>
  </main>
</div>

<!-- ==================== USER PROFILE MODAL ==================== -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">👤 My Profile</div>
      <button class="modal-close" onclick="closeModal('profileModal')">×</button>
    </div>
    <form onsubmit="saveProfile(event)">
      <div class="photo-upload" onclick="document.getElementById('profilePhotoInput').click()" style="width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px dashed rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;margin:0 auto 20px">
        <img id="profilePhotoPreview" class="hidden" style="width:100%;height:100%;object-fit:cover">
        <div id="profilePhotoPlaceholder" style="font-size:40px;color:#64748b">📷</div>
      </div>
      <input type="file" id="profilePhotoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Full Name</label><input type="text" id="prof_name" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Username</label><input type="text" id="prof_username" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Role</label><input type="text" class="form-control" id="prof_role" readonly style="opacity:0.6"></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="prof_email" class="form-control"></div>
        <div class="form-group"><label class="form-label">Phone</label><input type="text" id="prof_phone" class="form-control"></div>
      </div>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1)">
        <h3 style="color:white;font-size:15px;margin-bottom:12px">🔒 Change Password</h3>
        <div class="grid-2">
          <div class="form-group"><label class="form-label">New Password</label><input type="password" id="prof_newpass" class="form-control" placeholder="Leave blank to keep current"></div>
          <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" id="prof_confirmpass" class="form-control"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap">
        <button type="button" class="btn btn-secondary" onclick="closeModal('profileModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">💾 Save Profile</button>
      </div>
    </form>
  </div>
</div>

<script>
// ============================================================================
// CORE ARCHITECTURE - Modular System
// ============================================================================

// --- EventBus ---
class EventBus{
  constructor(){this.listeners=new Map();this.log=[]}
  on(e,c,m){if(!this.listeners.has(e))this.listeners.set(e,new Set());this.listeners.get(e).add({callback:c,module:m||'unknown'});return()=>this.off(e,c)}
  emit(e,d){this.log.push({time:Date.now(),event:e,data:JSON.stringify(d).substring(0,200)});if(this.log.length>500)this.log.shift();if(this.listeners.has(e))this.listeners.get(e).forEach(({callback:c,module:m})=>{try{c(d)}catch(err){diagnostics.logError(m,e,err)}})}
  off(e,c){if(this.listeners.has(e)){for(const item of this.listeners.get(e)){if(item.callback===c){this.listeners.get(e).delete(item);break}}}}
}

// --- Plugin Loader ---
class PluginLoader{
  constructor(){this.modules=new Map();this.activeModules=new Set()}
  register(n,m){this.modules.set(n,{name:n,module:m,loaded:false,dependencies:m.dependencies||[]})}
  async load(n){const p=this.modules.get(n);if(!p)throw new Error(`Module ${n} not found`);if(p.loaded)return;for(const d of p.dependencies){if(!this.activeModules.has(d))await this.load(d)}try{if(p.module.init)await p.module.init();p.loaded=true;this.activeModules.add(n)}catch(e){console.error(e)}}
  listAll(){return Array.from(this.modules.keys())}
  listActive(){return Array.from(this.activeModules)}
}

// --- Diagnostics ---
class DiagnosticsModule{
  constructor(){this.errors=[];this.warnings=[];this.healthChecks=[];this.startTime=Date.now()}
  logError(m,c,e){this.errors.push({id:Date.now(),timestamp:new Date().toISOString(),module:m,context:c,message:e?.message||String(e),severity:'error'});if(this.errors.length>200)this.errors.shift()}
  logWarning(m,c,msg){this.warnings.push({id:Date.now(),timestamp:new Date().toISOString(),module:m,context:c,message:msg,severity:'warning'});if(this.warnings.length>200)this.warnings.shift()}
  registerHealthCheck(n,f){this.healthChecks.push({name:n,check:f})}
  runHealthChecks(){return this.healthChecks.map(c=>{try{const r=c.check();return{name:c.name,status:r.status||'healthy',message:r.message||''}}catch(e){return{name:c.name,status:'critical',message:e.message}}})}
  getSystemHealth(){const c=this.runHealthChecks();const cr=c.filter(x=>x.status==='critical').length;const w=c.filter(x=>x.status==='warning').length;return{overall:cr>0?'critical':w>0?'warning':'healthy',total:c.length,critical:cr,warning:w,healthy:c.filter(x=>x.status==='healthy').length,checks:c,uptime:Date.now()-this.startTime,errorCount:this.errors.length,warningCount:this.warnings.length,dbSize:new Blob([localStorage.getItem('iconhair_db_v4')||'']).size}}
  getReport(){return{generatedAt:new Date().toISOString(),system:this.getSystemHealth(),errors:this.errors.slice(-50),warnings:this.warnings.slice(-50),modules:pluginLoader.listAll(),activeModules:pluginLoader.listActive(),users:db.tables.users.length,database:{customers:db.tables.customers.length,appointments:db.tables.appointments.length,sales:db.tables.sales.length,expenses:db.tables.expenses.length,purchases:db.tables.purchases.length,products:db.tables.products.length,services:db.tables.services.length,staff:db.tables.staff.length,suppliers:db.tables.suppliers.length,legacy:db.tables.legacy.length}}}
  exportReport(){const b=new Blob([JSON.stringify(this.getReport(),null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`iconhair_diagnostic_${new Date().toISOString().split('T')[0]}.json`;a.click();URL.revokeObjectURL(u)}
  clearLogs(){this.errors=[];this.warnings=[]}
}

function getStock(productId){const p=db.tables.products.find(x=>x.id===productId);if(!p)return 0;const purchased=db.tables.purchases.filter(x=>x.productId===productId).reduce((s,x)=>s+x.qty,0);const sold=db.tables.sales.filter(x=>x.type==='Product'&&x.itemId===productId).reduce((s,x)=>s+x.qty,0);return p.openingStock+purchased-sold-p.usedDamaged}
function getCustomerStats(custId){const sales=db.tables.sales.filter(x=>x.customerId===custId);const total=sales.reduce((s,x)=>s+x.total,0);const visits=sales.length;const lastVisit=sales.length>0?sales.sort((a,b)=>b.date.localeCompare(a.date))[0].date:null;return{total,visits,lastVisit}}
function getMonthlyStats(month){const prefix=month||today().substring(0,7);const sales=db.tables.sales.filter(x=>x.date.startsWith(prefix));const expenses=db.tables.expenses.filter(x=>x.date.startsWith(prefix));const purchases=db.tables.purchases.filter(x=>x.date.startsWith(prefix));const totalSales=sales.reduce((s,x)=>s+x.total,0);const totalExpenses=expenses.reduce((s,x)=>s+x.amount,0)+purchases.reduce((s,x)=>s+x.total,0);return{totalSales,totalExpenses,netProfit:totalSales-totalExpenses,salesCount:sales.length}}
function generateInvoiceNo(){const prefix=db.tables.settings.invPrefix||'INV-';const todaySales=db.tables.sales.filter(x=>x.date===today());const num=todaySales.length+1;return prefix+today().replace(/-/g,'')+'-'+num.toString().padStart(3,'0')}

  const reader=new FileReader();
  reader.onload=(ev)=>{
    const img=document.getElementById('profilePhotoPreview');

    db.tables.users[idx].email=document.getElementById('prof_email').value;

function openUserModal(user=null){
  document.getElementById('userModalTitle').textContent=user?'Edit User':'New User';
  document.getElementById('user_edit_id').value=user?user.id:'';
  document.getElementById('u_name').value=user?user.name:'';
  document.getElementById('u_username').value=user?user.username:'';
  document.getElementById('u_password').value='';
  document.getElementById('u_password').required=!user;
  document.getElementById('u_role').value=user?user.role:'staff';
  document.getElementById('u_email').value=user?user.email||'':'';
  document.getElementById('u_phone').value=user?user.phone||'':'';
  document.getElementById('u_active').checked=user?user.active!==false:true;
  openModal('userModal');
}

function editUser(id){const u=db.tables.users.find(x=>x.id===id);if(u)openUserModal(u)}

function saveUser(e){
  e.preventDefault();
  const editId=document.getElementById('user_edit_id').value;
  const username=document.getElementById('u_username').value.trim();
  const password=document.getElementById('u_password').value;
  const duplicate=db.tables.users.find(u=>u.username===username&&u.id!=editId);
  if(duplicate){showAlert('Username already exists','danger');return}
  const userData={
    name:document.getElementById('u_name').value,
    username,
    role:document.getElementById('u_role').value,
    email:document.getElementById('u_email').value,
    phone:document.getElementById('u_phone').value,
    active:document.getElementById('u_active').checked
  };
  if(editId){
    const idx=db.tables.users.findIndex(u=>u.id==editId);
    if(idx!==-1){
      if(password)userData.password=password;
      db.tables.users[idx]={...db.tables.users[idx],...userData,updated_at:new Date().toISOString()};
    }
  }else{
    userData.password=password;
    userData.photo=null;
    userData.created_at=new Date().toISOString();
    db.tables.users.push({id:getNextId(db.tables.users),...userData});
  }
  db.save();
  closeModal('userModal');
  showAlert('User saved!');
  renderUsers(document.getElementById('pageContainer'));
}

function toggleUser(id){
  const u=db.tables.users.find(x=>x.id===id);
  if(u&&u.id!==currentUser.id){
    u.active=!u.active;
    db.save();
    showAlert(`User ${u.active?'activated':'deactivated'}`);
    renderUsers(document.getElementById('pageContainer'));
  }
}

function deleteUser(id){
  if(id===currentUser.id){showAlert('Cannot delete yourself','danger');return}
  if(!confirm('Delete this user?'))return;
  db.tables.users=db.tables.users.filter(x=>x.id!==id);
  db.save();
  showAlert('User deleted');
  renderUsers(document.getElementById('pageContainer'));
}

function renderCalendar(container){container.innerHTML=`<div class="card"><div class="flex-between mb-3" style="flex-wrap:wrap;gap:10px"><input type="date" id="calDate" class="form-control" style="width:auto;min-width:160px" value="${today()}" onchange="updateCalendar()"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="form-label" style="margin:0;font-size:12px">Opens</label><input type="time" id="calOpen" value="10:00" class="form-control" style="width:110px" onchange="updateCalendar()"><label class="form-label" style="margin:0;font-size:12px">Closes</label><input type="time" id="calClose" value="21:00" class="form-control" style="width:110px" onchange="updateCalendar()"></div></div><div id="calendarGrid" class="calendar-grid" style="overflow-x:auto"></div></div>`;updateCalendar()}
function updateCalendar(){const date=document.getElementById('calDate').value||today();const open=document.getElementById('calOpen').value||'10:00';const close=document.getElementById('calClose').value||'21:00';const openMin=timeToMin(open);const closeMin=timeToMin(close);const slotMin=30;const dayAppts=db.tables.appointments.filter(a=>a.date===date&&!['Cancelled','No-show'].includes(a.status));const staffList=db.tables.staff.filter(s=>s.active!==false);let html=`<div class="calendar-header">Time</div>`;staffList.forEach(s=>{html+=`<div class="calendar-header">${escapeHtml(s.name)}</div>`});for(let m=openMin;m<closeMin;m+=slotMin){const h=Math.floor(m/60),mi=m%60;const timeStr=`${h.toString().padStart(2,'0')}:${mi.toString().padStart(2,'0')}`;html+=`<div class="calendar-cell calendar-time">${formatTime(timeStr)}</div>`;staffList.forEach(s=>{const appt=dayAppts.find(a=>a.staffId===s.id&&timeToMin(a.time)<=m&&timeToMin(a.time)+a.duration>m);let cls='calendar-cell calendar-slot';let content='';if(appt){if(timeToMin(appt.time)===m){const cust=db.tables.customers.find(c=>c.id===appt.customerId);const srv=db.tables.services.find(sv=>sv.id===appt.serviceId);cls+=` ${appt.status.toLowerCase()}`;content=`<strong style="font-size:10px;color:white">${cust?.name||'-'}</strong><br><span style="font-size:9px;color:#94a3b8">${srv?.name||''}</span>`}}html+=`<div class="${cls}">${content}</div>`})}document.getElementById('calendarGrid').innerHTML=html}

function editAppointment(id){const a=db.tables.appointments.find(x=>x.id===id);if(!a)return;openModal('appointmentModal');setTimeout(()=>{document.getElementById('apt_customer').value=a.customerId;document.getElementById('apt_service').value=a.serviceId;document.getElementById('apt_staff').value=a.staffId;document.getElementById('apt_date').value=a.date;document.getElementById('apt_time').value=a.time;document.getElementById('apt_duration').value=a.duration;document.getElementById('apt_status').value=a.status;document.getElementById('apt_booked_via').value=a.bookedVia||'Phone call';document.getElementById('apt_notes').value=a.notes||''},100);const form=document.querySelector('#appointmentModal form');const oldSubmit=form.onsubmit;form.onsubmit=function(ev){ev.preventDefault();db.tables.appointments=db.tables.appointments.filter(x=>x.id!==id);saveAppointment(ev);form.onsubmit=oldSubmit}}
function deleteAppointment(id){if(confirm('Delete this appointment?')){db.tables.appointments=db.tables.appointments.filter(x=>x.id!==id);db.save();showAlert('Deleted');renderAppointments(document.getElementById('pageContainer'))}}
function saveAppointment(e){e.preventDefault();const staffId=parseInt(document.getElementById('apt_staff').value);const date=document.getElementById('apt_date').value;const time=document.getElementById('apt_time').value;const duration=parseInt(document.getElementById('apt_duration').value);const startMin=timeToMin(time);const endMin=startMin+duration;const clash=db.tables.appointments.find(a=>a.staffId===staffId&&a.date===date&&!['Cancelled','No-show'].includes(a.status)&&timeToMin(a.time)<endMin&&timeToMin(a.time)+a.duration>startMin);if(clash){document.getElementById('aptClashAlert').innerHTML=`<div class="alert alert-warning">⚠️ Time clash detected!</div>`;if(!confirm('Clash detected. Save anyway?'))return}db.tables.appointments.push({id:getNextId(db.tables.appointments),customerId:parseInt(document.getElementById('apt_customer').value),serviceId:parseInt(document.getElementById('apt_service').value),staffId,date,time,duration,status:document.getElementById('apt_status').value,bookedVia:document.getElementById('apt_booked_via').value,notes:document.getElementById('apt_notes').value,created_at:new Date().toISOString()});db.save();closeModal('appointmentModal');e.target.reset();showAlert('Appointment saved!');renderAppointments(document.getElementById('pageContainer'))}

// SALES
// ============================================================================
function renderSales(container){
  const sorted=[...db.tables.sales].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  container.innerHTML=`<div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:16px;color:white">💰 All Sales (${sorted.length})</h3><button class="btn btn-primary btn-sm" onclick="openModal('saleModal')">➕ New Sale</button></div><div class="table-wrap"><table><thead><tr><th>Invoice #</th><th>Date</th><th>Customer</th><th>Type</th><th>Item</th><th>Qty</th><th>Total</th><th>Payment</th><th>Actions</th></tr></thead><tbody>${sorted.length===0?`<tr><td colspan="9" class="text-center" style="padding:30px;color:#64748b">No sales</td></tr>`:sorted.map(s=>{const cust=db.tables.customers.find(c=>c.id===s.customerId);const item=s.type==='Service'?db.tables.services.find(x=>x.id===s.itemId):db.tables.products.find(x=>x.id===s.itemId);return `<tr><td><strong>${s.invoiceNo}</strong></td><td>${formatDate(s.date)}</td><td>${cust?.name||'-'}</td><td><span class="badge badge-purple">${s.type}</span></td><td>${item?.name||'-'}</td><td>${s.qty}</td><td><strong>${formatMoney(s.total)}</strong></td><td>${s.payment}${s.paymentRef?'<br><small>'+s.paymentRef+'</small>':''}</td><td><button class="btn btn-sm btn-danger" onclick="deleteSale(${s.id})">🗑️</button></td></tr>`}).join('')}</tbody></table></div></div>${saleModalHTML()}`;
}
function saleModalHTML(){return `<div class="modal-overlay" id="saleModal"><div class="modal"><div class="modal-header"><div class="modal-title">New Sale</div><button class="modal-close" onclick="closeModal('saleModal')">×</button></div><form onsubmit="saveSale(event)"><div class="grid-2">
  <div class="form-group"><label class="form-label">Customer</label><select id="sale_customer" class="form-control"><option value="">--</option>${db.tables.customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select></div>
  <div class="form-group"><label class="form-label">Type *</label><select id="sale_type" class="form-control" required onchange="updateSaleItems()"><option value="Service">Service</option><option value="Product">Product</option></select></div>
  <div class="form-group"><label class="form-label">Item *</label><select id="sale_item" class="form-control" required onchange="autoFillSalePrice()"></select></div>
  <div class="form-group"><label class="form-label">Qty *</label><input type="number" id="sale_qty" class="form-control" value="1" min="1" required onchange="calcSaleTotal()"></div>
  <div class="form-group"><label class="form-label">Unit Price *</label><input type="number" id="sale_price" class="form-control" step="0.01" required onchange="calcSaleTotal()"></div>
  <div class="form-group"><label class="form-label">Discount</label><input type="number" id="sale_discount" class="form-control" value="0" step="0.01" onchange="calcSaleTotal()"></div>
  <div class="form-group"><label class="form-label">Total *</label><input type="number" id="sale_total" class="form-control" step="0.01" readonly style="font-weight:700;font-size:16px"></div>
  <div class="form-group"><label class="form-label">Payment *</label><select id="sale_payment" class="form-control" required><option>Cash</option><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Card</option><option>Bank transfer</option></select></div>
  <div class="form-group" style="grid-column:1/-1"><label class="form-label">Payment Reference (for online)</label><input type="text" id="sale_ref" class="form-control" placeholder="TxID"></div>
</div><div class="form-group"><label class="form-label">Notes</label><textarea id="sale_notes" class="form-control" rows="2"></textarea></div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('saleModal')">Cancel</button><button type="submit" class="btn btn-primary">💾 Save</button></div></form></div></div>`}
function updateSaleItems(){const type=document.getElementById('sale_type').value;const sel=document.getElementById('sale_item');if(type==='Service'){sel.innerHTML=db.tables.services.map(s=>`<option value="${s.id}" data-price="${s.price}">${escapeHtml(s.name)} - ${formatMoney(s.price)}</option>`).join('')}else{sel.innerHTML=db.tables.products.map(p=>`<option value="${p.id}" data-price="${p.sellingPrice}">${escapeHtml(p.name)} - ${formatMoney(p.sellingPrice)} (Stock: ${getStock(p.id)})</option>`).join('')}autoFillSalePrice()}
function autoFillSalePrice(){const sel=document.getElementById('sale_item');document.getElementById('sale_price').value=sel.options[sel.selectedIndex]?.dataset.price||0;calcSaleTotal()}
function calcSaleTotal(){const qty=parseFloat(document.getElementById('sale_qty').value)||1;const price=parseFloat(document.getElementById('sale_price').value)||0;const discount=parseFloat(document.getElementById('sale_discount').value)||0;document.getElementById('sale_total').value=(qty*price-discount).toFixed(2)}
function saveSale(e){e.preventDefault();const type=document.getElementById('sale_type').value;const itemId=parseInt(document.getElementById('sale_item').value);const qty=parseInt(document.getElementById('sale_qty').value);if(type==='Product'){const stock=getStock(itemId);if(qty>stock){showAlert(`Out of stock! Only ${stock} left`,'danger');return}}const invoiceNo=generateInvoiceNo();db.tables.sales.push({id:getNextId(db.tables.sales),invoiceNo,date:today(),customerId:parseInt(document.getElementById('sale_customer').value)||null,type,itemId,qty,unitPrice:parseFloat(document.getElementById('sale_price').value),discount:parseFloat(document.getElementById('sale_discount').value)||0,total:parseFloat(document.getElementById('sale_total').value),payment:document.getElementById('sale_payment').value,paymentRef:document.getElementById('sale_ref').value,notes:document.getElementById('sale_notes').value,created_at:new Date().toISOString()});db.save();closeModal('saleModal');e.target.reset();showAlert('Sale saved! Invoice: '+invoiceNo);renderSales(document.getElementById('pageContainer'))}
function deleteSale(id){if(confirm('Delete this sale?')){db.tables.sales=db.tables.sales.filter(x=>x.id!==id);db.save();showAlert('Deleted');renderSales(document.getElementById('pageContainer'))}}

function renderInvoice(container){const invoices=[...new Set(db.tables.sales.map(s=>s.invoiceNo))].sort().reverse();container.innerHTML=`<div class="card no-print mb-4"><div class="flex-between" style="flex-wrap:wrap;gap:10px"><div><label class="form-label">Select Invoice</label><select id="invoiceSelect" class="form-control" style="width:100%;max-width:300px" onchange="updateInvoice()">${invoices.length?invoices.map(i=>`<option value="${i}">${i}</option>`).join(''):`<option>No invoices</option>`}</select></div><button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print / PDF</button></div></div><div class="invoice-box" id="invoicePrintArea" style="background:white;color:black"></div>`;updateInvoice()}
function updateInvoice(){const invNo=document.getElementById('invoiceSelect').value;const lines=db.tables.sales.filter(s=>s.invoiceNo===invNo);const area=document.getElementById('invoicePrintArea');if(lines.length===0){area.innerHTML=`<div class="text-center" style="padding:40px;color:#64748b">No data</div>`;return}const first=lines[0];const cust=db.tables.customers.find(c=>c.id===first.customerId);const subtotal=lines.reduce((s,x)=>s+(x.qty*x.unitPrice),0);const discount=lines.reduce((s,x)=>s+(x.discount||0),0);const total=lines.reduce((s,x)=>s+x.total,0);area.innerHTML=`<div style="display:flex;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--primary);flex-wrap:wrap;gap:16px"><div><div style="font-size:24px;font-weight:800;color:var(--primary)">ICON HAIR</div><div style="color:#64748b;font-size:12px;margin-top:4px">Studio & Grooming</div><div style="font-size:11px;margin-top:8px;color:#64748b">${db.tables.settings.bizAddress}<br>📞 ${db.tables.settings.bizPhone}<br>✉️ ${db.tables.settings.bizEmail}</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:700;color:var(--primary)">INVOICE</div><div style="margin-top:12px;font-size:13px"><strong>Invoice No:</strong> ${invNo}</div><div style="font-size:13px"><strong>Date:</strong> ${formatDate(first.date)}</div><div style="font-size:13px"><strong>Payment:</strong> ${first.payment}</div>${first.paymentRef?`<div style="font-size:13px"><strong>Reference:</strong> ${first.paymentRef}</div>`:''}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px"><div><div style="font-weight:700;color:var(--primary);margin-bottom:6px;font-size:13px">FROM</div><div style="font-size:13px">${db.tables.settings.bizName}<br>${db.tables.settings.bizAddress}</div></div><div><div style="font-weight:700;color:var(--primary);margin-bottom:6px;font-size:13px">BILL TO</div><div style="font-size:13px">${cust?.name||'Walk-in Customer'}<br>${cust?.phone||''}<br>${cust?.area||''}</div></div></div><table style="width:100%;margin:16px 0;border-collapse:collapse"><thead><tr style="background:var(--primary);color:white"><th style="padding:10px;text-align:left">#</th><th style="padding:10px;text-align:left">Item</th><th style="padding:10px;text-align:left">Qty</th><th style="padding:10px;text-align:left">Unit Price</th><th style="padding:10px;text-align:left">Discount</th><th style="padding:10px;text-align:right">Total</th></tr></thead><tbody>${lines.map((l,i)=>{const item=l.type==='Service'?db.tables.services.find(x=>x.id===l.itemId):db.tables.products.find(x=>x.id===l.itemId);return `<tr style="border-bottom:1px solid #e2e8f0"><td style="padding:10px">${i+1}</td><td style="padding:10px">${item?.name||'-'}<br><small style="color:#64748b">${l.type}</small></td><td style="padding:10px">${l.qty}</td><td style="padding:10px">${formatMoney(l.unitPrice)}</td><td style="padding:10px">${formatMoney(l.discount||0)}</td><td style="padding:10px;text-align:right;font-weight:600">${formatMoney(l.total)}</td></tr>`}).join('')}</tbody></table><div style="text-align:right;font-size:18px;font-weight:700;margin-top:16px;padding-top:12px;border-top:2px solid #e2e8f0"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px"><span>Subtotal:</span><span>${formatMoney(subtotal)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px"><span>Discount:</span><span>${formatMoney(discount)}</span></div><div style="display:flex;justify-content:space-between;font-size:20px;color:var(--primary);border-top:2px solid #e2e8f0;padding-top:8px;margin-top:8px"><span>TOTAL:</span><span>${formatMoney(total)}</span></div></div><div style="margin-top:30px;padding-top:16px;border-top:1px solid #e2e8f0;text-align:center;color:#64748b;font-size:12px"><div style="font-weight:600;color:var(--primary);margin-bottom:6px">Thank you for choosing ICON HAIR!</div></div>`}

function renderCustomers(container){container.innerHTML=`<div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:16px;color:white">👥 All Customers (${db.tables.customers.length})</h3><button class="btn btn-primary btn-sm" onclick="openModal('customerModal')">➕ New Customer</button></div><div style="position:relative;margin-bottom:16px"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748b">🔍</span><input type="text" id="customerSearch" class="form-control" style="padding-left:36px" placeholder="Search by name, phone, area..." oninput="filterCustomers()"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Area</th><th>Total Spent</th><th>Visits</th><th>Last Visit</th><th>Actions</th></tr></thead><tbody id="customersBody"></tbody></table></div></div><div class="modal-overlay" id="customerModal"><div class="modal"><div class="modal-header"><div class="modal-title">New Customer</div><button class="modal-close" onclick="closeModal('customerModal')">×</button></div><form onsubmit="saveCustomer(event)"><div class="grid-2">
  <div class="form-group"><label class="form-label">Name *</label><input type="text" id="cust_name" class="form-control" required></div>
  <div class="form-group"><label class="form-label">Phone *</label><input type="text" id="cust_phone" class="form-control" required placeholder="01712345678"></div>
  <div class="form-group"><label class="form-label">Email</label><input type="email" id="cust_email" class="form-control"></div>
  <div class="form-group"><label class="form-label">Birthday</label><input type="date" id="cust_birthday" class="form-control"></div>
  <div class="form-group"><label class="form-label">Area</label><select id="cust_area" class="form-control"><option value="">--</option><option>Uttara</option><option>Mirpur</option><option>Gulshan</option><option>Banani</option><option>Dhanmondi</option><option>Other</option></select></div>
  <div class="form-group"><label class="form-label">SMS Consent</label><select id="cust_sms" class="form-control"><option value="No">No</option><option value="Yes">Yes</option></select></div>
</div><div class="form-group"><label class="form-label">Notes</label><textarea id="cust_notes" class="form-control" rows="2"></textarea></div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('customerModal')">Cancel</button><button type="submit" class="btn btn-primary">💾 Save</button></div></form></div></div>`;filterCustomers()}
function filterCustomers(){const query=(document.getElementById('customerSearch')?.value||'').toLowerCase();const tbody=document.getElementById('customersBody');if(!tbody)return;const filtered=db.tables.customers.filter(c=>!query||(c.name&&c.name.toLowerCase().includes(query))||(c.phone&&c.phone.includes(query))||(c.area&&c.area.toLowerCase().includes(query)));tbody.innerHTML=filtered.length===0?`<tr><td colspan="7" class="text-center" style="padding:30px;color:#64748b">No customers found</td></tr>`:filtered.map(c=>{const stats=getCustomerStats(c.id);return `<tr><td><strong>${escapeHtml(c.name)}</strong></td><td>${escapeHtml(c.phone)}</td><td>${escapeHtml(c.area||'-')}</td><td>${formatMoney(stats.total)}</td><td>${stats.visits}</td><td>${stats.lastVisit?formatDate(stats.lastVisit):'-'}</td><td><button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.id})">🗑️</button></td></tr>`}).join('')}
function saveCustomer(e){e.preventDefault();const phone=document.getElementById('cust_phone').value.trim();if(db.tables.customers.find(c=>c.phone===phone)){showAlert('Phone already exists','danger');return}db.tables.customers.push({id:getNextId(db.tables.customers),name:document.getElementById('cust_name').value,phone,email:document.getElementById('cust_email').value,birthday:document.getElementById('cust_birthday').value,area:document.getElementById('cust_area').value,smsConsent:document.getElementById('cust_sms').value,notes:document.getElementById('cust_notes').value,created_at:new Date().toISOString()});db.save();closeModal('customerModal');e.target.reset();showAlert('Customer saved!');renderCustomers(document.getElementById('pageContainer'))}
function deleteCustomer(id){if(confirm('Delete this customer?')){db.tables.customers=db.tables.customers.filter(x=>x.id!==id);db.save();showAlert('Deleted');renderCustomers(document.getElementById('pageContainer'))}}

function renderInventory(container){container.innerHTML=`<div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:16px;color:white">📦 Inventory (${db.tables.products.length})</h3><button class="btn btn-primary btn-sm" onclick="openModal('productModal')">➕ New Product</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Unit</th><th>Stock</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>${db.tables.products.length===0?`<tr><td colspan="7" class="text-center" style="padding:30px;color:#64748b">No products</td></tr>`:db.tables.products.map(p=>{const stock=getStock(p.id);let status='ok',statusCls='success';if(stock<=0){status='out';statusCls='danger'}else if(stock<=p.reorderLevel){status='low';statusCls='warning'}return `<tr><td><strong>${escapeHtml(p.name)}</strong></td><td>${escapeHtml(p.category)}</td><td>${escapeHtml(p.unit)}</td><td><strong>${stock}</strong></td><td>${formatMoney(p.sellingPrice)}</td><td><span class="badge badge-${statusCls}">${status}</span></td><td><button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">🗑️</button></td></tr>`}).join('')}</tbody></table></div></div><div class="modal-overlay" id="productModal"><div class="modal"><div class="modal-header"><div class="modal-title">New Product</div><button class="modal-close" onclick="closeModal('productModal')">×</button></div><form onsubmit="saveProduct(event)"><div class="grid-2">
  <div class="form-group"><label class="form-label">Name *</label><input type="text" id="prod_name" class="form-control" required></div>
  <div class="form-group"><label class="form-label">Category *</label><select id="prod_category" class="form-control" required><option>Hair care</option><option>Styling</option><option>Grooming</option><option>Hair system supplies</option><option>Other</option></select></div>
  <div class="form-group"><label class="form-label">Unit *</label><select id="prod_unit" class="form-control" required><option>pcs</option><option>bottle</option><option>jar</option><option>box</option><option>kg</option></select></div>
  <div class="form-group"><label class="form-label">Opening Stock</label><input type="number" id="prod_stock" class="form-control" value="0" min="0"></div>
  <div class="form-group"><label class="form-label">Selling Price</label><input type="number" id="prod_price" class="form-control" step="0.01" value="0"></div>
  <div class="form-group"><label class="form-label">Reorder Level</label><input type="number" id="prod_reorder" class="form-control" value="3" min="0"></div>
</div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('productModal')">Cancel</button><button type="submit" class="btn btn-primary">💾 Save</button></div></form></div></div>`}
function saveProduct(e){e.preventDefault();db.tables.products.push({id:getNextId(db.tables.products),name:document.getElementById('prod_name').value,category:document.getElementById('prod_category').value,unit:document.getElementById('prod_unit').value,openingStock:parseInt(document.getElementById('prod_stock').value)||0,usedDamaged:0,sellingPrice:parseFloat(document.getElementById('prod_price').value)||0,reorderLevel:parseInt(document.getElementById('prod_reorder').value)||3,created_at:new Date().toISOString()});db.save();closeModal('productModal');e.target.reset();showAlert('Product saved!');renderInventory(document.getElementById('pageContainer'))}
function deleteProduct(id){if(confirm('Delete?')){db.tables.products=db.tables.products.filter(x=>x.id!==id);db.save();showAlert('Deleted');renderInventory(document.getElementById('pageContainer'))}}

  <div class="form-group"><label class="form-label">Date *</label><input type="date" id="pur_date" class="form-control" value="${today()}" required></div>
  <div class="form-group"><label class="form-label">Product *</label><select id="pur_product" class="form-control" required>${db.tables.products.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
  <div class="form-group"><label class="form-label">Supplier *</label><select id="pur_supplier" class="form-control" required>${db.tables.suppliers.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select></div>
  <div class="form-group"><label class="form-label">Qty *</label><input type="number" id="pur_qty" class="form-control" min="1" value="1" required></div>

let parsedImportRecords=[];
function renderImport(container){container.innerHTML=`<div class="card mb-4"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:16px;color:white">📥 Import from WhatsApp</h3></div><div class="alert alert-info" style="margin-bottom:16px"><strong>📝 Format:</strong> Date, Voucher No, Name, Address, Ph number, Work type, System, Size, Price, Deal by, Appointment, Source, Office, Technician, Token, Total Setting, Customer's Evaluation</div><div class="form-group"><label class="form-label">Paste WhatsApp Data Here:</label><textarea id="importData" rows="12" class="form-control" style="font-family:monospace;font-size:12px" placeholder="13-10-2026\nVoucher No: 12934\nName : Shamim\nAddress : Kushtia\nPh number: 01648862587\nWork type : Setting\nSystem: Mono\nSize: 7x9\nPrice : 5500/-\nDeal by : CEO Ma'am\nAppointment: Rafiqul Sir\nSource : Whatsapp\nOffice: Uttara Office\nTechnician : Mohsen sir\nToken : U/O- Oct - 13\nTotal Setting : 2026 Till Now 36\nCustomer's Evaluation :\nকাস্টমার খুব খুশি হয়েছে。\nDone ✅"></textarea></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="parseImportData()">📋 Parse Data</button><button class="btn btn-secondary" onclick="clearImportData()">🗑️ Clear</button></div></div><div id="importPreviewSection" class="hidden"><div class="card mb-4"><h3 style="font-weight:700;font-size:15px;color:white;margin-bottom:16px">📊 Import Statistics</h3><div class="import-stats" id="importStats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px"></div></div><div class="card mb-4"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px;color:white">👁️ Preview</h3><div style="display:flex;gap:8px"><button class="btn btn-success btn-sm" onclick="importAllRecords()">✅ Import All</button><button class="btn btn-secondary btn-sm" onclick="exportImportCSV()">📤 Export CSV</button></div></div><div id="importRecordsList"></div></div></div>`}
function parseImportData(){const text=document.getElementById('importData').value.trim();if(!text){showAlert('No data','danger');return}parsedImportRecords=parseWhatsAppData(text);showImportPreview()}
function parseWhatsAppData(text){const blocks=text.split(/\n(?=\d{2}-\d{2}-\d{4})|\n\n+/);const records=[];blocks.forEach(block=>{if(!block.trim())return;const record={date:'',voucherNo:'',name:'',address:'',phone:'',workType:'',system:'',size:'',price:0,dealBy:'',appointment:'',source:'',office:'',technician:'',token:'',totalSetting:'',evaluation:'',status:'Completed',notes:''};const lines=block.split('\n');let currentField='';let evaluationBuffer='';lines.forEach(line=>{line=line.trim();if(!line)return;if(/^\d{2}-\d{2}-\d{4}$/.test(line)){record.date=line;return}const kvMatch=line.match(/^(.+?)\s*[:]\s*(.*)$/);if(kvMatch){const key=kvMatch[1].trim().toLowerCase();const value=kvMatch[2].trim();if(key.includes('voucher'))record.voucherNo=value;else if(key==='name')record.name=value;else if(key==='address')record.address=value;else if(key.includes('ph')||key.includes('phone')||key.includes('number'))record.phone=value;else if(key.includes('work'))record.workType=value;else if(key==='system')record.system=value;else if(key==='size')record.size=value;else if(key==='price'){record.price=parseFloat(value.replace(/[^0-9.]/g,''))||0}else if(key.includes('deal'))record.dealBy=value;else if(key.includes('appointment'))record.appointment=value;else if(key==='source')record.source=value;else if(key.includes('office'))record.office=value;else if(key.includes('technician'))record.technician=value;else if(key==='token')record.token=value;else if(key.includes('total'))record.totalSetting=value;else if(key.includes('evaluation')){currentField='evaluation';evaluationBuffer=value}else{currentField=''}}else{if(currentField==='evaluation'){evaluationBuffer+=' '+line}else if(line.includes('Done')||line.includes('✅')){record.status='Completed'}else{record.notes+=(record.notes?' ':'')+line}}});if(evaluationBuffer)record.evaluation=evaluationBuffer.trim();if(record.name||record.phone){record.phone=record.phone.replace(/[^0-9+]/g,'');records.push(record)}});return records}
function showImportPreview(){const section=document.getElementById('importPreviewSection');const statsDiv=document.getElementById('importStats');const listDiv=document.getElementById('importRecordsList');if(!section)return;section.classList.remove('hidden');let newCount=0,duplicateCount=0,errorCount=0;parsedImportRecords.forEach(r=>{if(!r.name&&!r.phone){errorCount++;return}if(r.phone&&db.tables.customers.find(c=>c.phone===r.phone)){duplicateCount++}else{newCount++}});statsDiv.innerHTML=`<div style="background:rgba(255,255,255,0.06);padding:14px;border-radius:12px;border-left:4px solid var(--primary);text-align:center"><div style="font-size:22px;font-weight:700;color:white">${parsedImportRecords.length}</div><div style="font-size:11px;color:#94a3b8;margin-top:4px">Total Found</div></div><div style="background:rgba(255,255,255,0.06);padding:14px;border-radius:12px;border-left:4px solid var(--success);text-align:center"><div style="font-size:22px;font-weight:700;color:white">${newCount}</div><div style="font-size:11px;color:#94a3b8;margin-top:4px">New</div></div><div style="background:rgba(255,255,255,0.06);padding:14px;border-radius:12px;border-left:4px solid var(--warning);text-align:center"><div style="font-size:22px;font-weight:700;color:white">${duplicateCount}</div><div style="font-size:11px;color:#94a3b8;margin-top:4px">Duplicates</div></div><div style="background:rgba(255,255,255,0.06);padding:14px;border-radius:12px;border-left:4px solid var(--danger);text-align:center"><div style="font-size:22px;font-weight:700;color:white">${errorCount}</div><div style="font-size:11px;color:#94a3b8;margin-top:4px">Errors</div></div>`;listDiv.innerHTML=parsedImportRecords.map((r,i)=>{const isDuplicate=r.phone&&db.tables.customers.find(c=>c.phone===r.phone);const hasError=!r.name&&!r.phone;return `<div style="background:rgba(255,255,255,0.04);border:1px solid ${hasError?'rgba(239,68,68,0.5)':isDuplicate?'rgba(245,158,11,0.5)':'rgba(16,185,129,0.5)'};border-radius:12px;padding:14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:10px"><div style="flex:1;min-width:200px"><div style="font-weight:700;font-size:15px;color:#6366f1">${escapeHtml(r.name)||'Unknown'}</div><div style="font-size:12px;color:#94a3b8;margin-top:4px">📱 ${escapeHtml(r.phone)||'N/A'} · 📍 ${escapeHtml(r.address)||'N/A'}</div></div><div style="text-align:right"><div style="font-weight:600;color:#10b981">${formatMoney(r.price)}</div><div style="font-size:11px;color:#94a3b8">${r.date||'N/A'}</div></div></div><div style="margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:12px"><div><span style="color:#94a3b8">🔧 Work:</span> ${escapeHtml(r.workType)||'-'}</div><div><span style="color:#94a3b8">💇 System:</span> ${escapeHtml(r.system)||'-'}</div><div><span style="color:#94a3b8">📏 Size:</span> ${escapeHtml(r.size)||'-'}</div><div><span style="color:#94a3b8">👨‍💼 Tech:</span> ${escapeHtml(r.technician)||'-'}</div><div><span style="color:#94a3b8">🎫 Token:</span> ${escapeHtml(r.token)||'-'}</div><div><span style="color:#94a3b8">📝 Voucher:</span> ${escapeHtml(r.voucherNo)||'-'}</div></div>${r.evaluation?`<div style="margin-top:8px;padding:8px;background:rgba(255,255,255,0.04);border-radius:6px;font-size:12px;font-style:italic;color:#94a3b8">💬 ${escapeHtml(r.evaluation)}</div>`:''}${isDuplicate?`<div style="margin-top:8px"><span class="badge badge-warning">⚠️ Duplicate phone</span></div>`:''}${hasError?`<div style="margin-top:8px"><span class="badge badge-danger">❌ Missing name and phone</span></div>`:''}</div>`}).join('')}
function importAllRecords(){if(parsedImportRecords.length===0){showAlert('No data','danger');return}let imported=0,duplicates=0,errors=0;parsedImportRecords.forEach(r=>{if(!r.name&&!r.phone){errors++;return}if(r.phone&&db.tables.customers.find(c=>c.phone===r.phone)){duplicates++;return}db.tables.customers.push({id:getNextId(db.tables.customers),name:r.name||'Unknown',phone:r.phone||'',email:'',birthday:'',address:r.address||'',area:'',voucherNo:r.voucherNo||'',workType:r.workType||'',system:r.system||'',size:r.size||'',price:r.price||0,dealBy:r.dealBy||'',appointment:r.appointment||'',source:r.source||'',office:r.office||'',technician:r.technician||'',token:r.token||'',totalSetting:r.totalSetting||'',evaluation:r.evaluation||'',status:r.status||'Completed',smsConsent:'No',consentSource:'Imported - WhatsApp',consentDate:today(),notes:r.notes||'',created_at:new Date().toISOString()});db.tables.legacy.push({id:getNextId(db.tables.legacy),date:r.date||today(),voucherNo:r.voucherNo,customer:r.name||'Unknown',customerPhone:r.phone,address:r.address,workType:r.workType,system:r.system,size:r.size,price:r.price,dealBy:r.dealBy,appointment:r.appointment,source:r.source,office:r.office,technician:r.technician,token:r.token,totalSetting:r.totalSetting,evaluation:r.evaluation,status:r.status,notes:r.notes,created_at:new Date().toISOString()});imported++});db.save();showAlert(`Imported: ${imported} new, ${duplicates} duplicates, ${errors} errors`);parsedImportRecords=[];document.getElementById('importData').value='';document.getElementById('importPreviewSection').classList.add('hidden')}
function clearImportData(){document.getElementById('importData').value='';parsedImportRecords=[];document.getElementById('importPreviewSection').classList.add('hidden')}
function exportImportCSV(){if(parsedImportRecords.length===0){showAlert('No data','danger');return}const headers=['Date','Voucher No','Name','Phone','Address','Work Type','System','Size','Price','Deal By','Appointment','Source','Office','Technician','Token','Total Setting','Evaluation','Status'];const rows=parsedImportRecords.map(r=>[r.date,r.voucherNo,r.name,r.phone,r.address,r.workType,r.system,r.size,r.price,r.dealBy,r.appointment,r.source,r.office,r.technician,r.token,r.totalSetting,r.evaluation,r.status]);const csv=[headers.join(','),...rows.map(r=>r.map(x=>`"${(x||'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`iconhair_import_${today()}.csv`;a.click();URL.revokeObjectURL(url);showAlert('CSV exported!')}

// ============================================================================
// DIAGNOSTICS
// ============================================================================
function renderDiagnostics(container){if(currentUser.role!=='manager'){container.innerHTML=`<div class="alert alert-danger">Access denied</div>`;return}const health=diagnostics.getSystemHealth();const overallColor=health.overall==='healthy'?'green':health.overall==='warning'?'orange':'red';container.innerHTML=`<div class="grid-4 mb-4"><div class="stat-card ${overallColor}"><div class="stat-label">Overall Health</div><div class="stat-value" style="color:var(--${overallColor==='green'?'success':overallColor==='orange'?'warning':'danger'})">${health.overall}</div><div class="stat-sub">${health.total} checks</div></div><div class="stat-card blue"><div class="stat-label">Uptime</div><div class="stat-value">${Math.floor(health.uptime/60000)}m</div></div><div class="stat-card red"><div class="stat-label">Errors</div><div class="stat-value">${health.errorCount}</div></div><div class="stat-card orange"><div class="stat-label">Warnings</div><div class="stat-value">${health.warningCount}</div></div></div><div class="grid-2 mb-4"><div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px;color:white">Module Status</h3></div><div>${pluginLoader.listAll().map(m=>{const active=pluginLoader.activeModules.has(m);const errors=diagnostics.errors.filter(e=>e.module===m).length;return `<div style="display:flex;align-items:center;gap:8px;padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04)"><div style="width:10px;height:10px;border-radius:50%;background:${errors>0?'#ef4444':active?'#10b981':'#f59e0b'}"></div><div style="flex:1"><strong style="color:white">${m}</strong><div style="font-size:11px;color:#94a3b8">${active?'Active':'Inactive'} · ${errors} errors</div></div></div>`}).join('')}</div></div><div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px;color:white">Health Checks</h3><button class="btn btn-primary btn-sm" onclick="runHealthChecks()">🔄 Run Checks</button></div><div>${health.checks.map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04)"><div style="width:10px;height:10px;border-radius:50%;background:${c.status==='healthy'?'#10b981':c.status==='warning'?'#f59e0b':'#ef4444'}"></div><div style="flex:1"><strong style="color:white">${c.name}</strong><div style="font-size:11px;color:#94a3b8">${c.message||''}</div></div></div>`).join('')}</div></div></div><div class="card mb-4"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px;color:white">System Report</h3><button class="btn btn-primary btn-sm" onclick="diagnostics.exportReport()">📤 Export</button></div><div style="background:#0f172a;padding:16px;border-radius:10px;font-family:monospace;font-size:12px;max-height:300px;overflow-y:auto;color:#e2e8f0"><pre>${JSON.stringify(diagnostics.getReport(),null,2)}</pre></div></div>`}
function runHealthChecks(){diagnostics.runHealthChecks();renderDiagnostics(document.getElementById('pageContainer'));showAlert('Health checks completed')}
function registerHealthChecks(){diagnostics.registerHealthCheck('Database Integrity',()=>{const tables=['customers','appointments','sales','expenses','purchases','products','services','staff','suppliers','legacy','users'];const missing=tables.filter(t=>!Array.isArray(db.tables[t]));return{status:missing.length===0?'healthy':'critical',message:missing.length===0?'All tables exist':`Missing: ${missing.join(', ')}`}});diagnostics.registerHealthCheck('Stock Consistency',()=>{const issues=db.tables.products.filter(p=>getStock(p.id)<0);return{status:issues.length===0?'healthy':'warning',message:issues.length===0?'All stock positive':`${issues.length} products with negative stock`}});diagnostics.registerHealthCheck('Admin User Exists',()=>{const admin=db.tables.users.find(u=>u.username==='admin');return{status:admin?'healthy':'critical',message:admin?'Admin user exists':'Admin user missing!'}});diagnostics.registerHealthCheck('Settings Complete',()=>{const s=db.tables.settings;const missing=[];if(!s.bizName)missing.push('bizName');if(!s.bizPhone)missing.push('bizPhone');return{status:missing.length===0?'healthy':'warning',message:missing.length===0?'All settings complete':`Missing: ${missing.join(', ')}`}})}

// ============================================================================
function renderSettings(container){if(currentUser.role!=='manager'){container.innerHTML=`<div class="alert alert-danger">Access denied</div>`;return}container.innerHTML=`<div class="card mb-4"><h3 style="font-weight:700;font-size:16px;color:white;margin-bottom:16px">🏢 Business Information</h3><div class="grid-2">
  <div class="form-group"><label class="form-label">Business Name</label><input type="text" id="setBizName" class="form-control" value="${db.tables.settings.bizName||''}"></div>
  <div class="form-group"><label class="form-label">Phone</label><input type="text" id="setBizPhone" class="form-control" value="${db.tables.settings.bizPhone||''}"></div>
  <div class="form-group" style="grid-column:1/-1"><label class="form-label">Address</label><input type="text" id="setBizAddress" class="form-control" value="${db.tables.settings.bizAddress||''}"></div>
  <div class="form-group"><label class="form-label">Email</label><input type="email" id="setBizEmail" class="form-control" value="${db.tables.settings.bizEmail||''}"></div>
  <div class="form-group"><label class="form-label">Invoice Prefix</label><input type="text" id="setInvPrefix" class="form-control" value="${db.tables.settings.invPrefix||'INV-'}"></div>
</div><button class="btn btn-primary mt-3" onclick="saveSettings()">💾 Save Settings</button></div><div class="card"><h3 style="font-weight:700;font-size:16px;color:white;margin-bottom:16px">💾 Data Management</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="exportData()">📤 Export JSON</button><label class="btn btn-success btn-sm" style="cursor:pointer">📥 Import JSON<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label><button class="btn btn-danger btn-sm" onclick="if(confirm('Reset ALL data?'))resetAllData()">🗑️ Reset All</button></div></div>`}
function saveSettings(){db.tables.settings.bizName=document.getElementById('setBizName').value;db.tables.settings.bizPhone=document.getElementById('setBizPhone').value;db.tables.settings.bizAddress=document.getElementById('setBizAddress').value;db.tables.settings.bizEmail=document.getElementById('setBizEmail').value;db.tables.settings.invPrefix=document.getElementById('setInvPrefix').value;db.save();showAlert('Settings saved!')}
function exportData(){const dataStr=JSON.stringify(db.tables,null,2);const blob=new Blob([dataStr],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`iconhair_backup_${today()}.json`;a.click();URL.revokeObjectURL(url);showAlert('Backup exported!')}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{try{const imported=JSON.parse(e.target.result);if(confirm('This will replace all data. Continue?')){db.tables=imported;db.save();showAlert('Data imported!');renderCurrentPage()}}catch(err){showAlert('Invalid file','danger')}};reader.readAsText(file)}
function resetAllData(){localStorage.removeItem('iconhair_db_v4');location.reload()}

// ============================================================================
// INIT
// ============================================================================
async function initApp(){
  try{
    await db.load();
    registerHealthChecks();
    const modules={dashboard:{dependencies:[],init:async()=>{}},calendar:{dependencies:[],init:async()=>{}},appointments:{dependencies:[],init:async()=>{}},sales:{dependencies:[],init:async()=>{}},invoice:{dependencies:[],init:async()=>{}},customers:{dependencies:[],init:async()=>{}},inventory:{dependencies:[],init:async()=>{}},products:{dependencies:[],init:async()=>{}},purchases:{dependencies:[],init:async()=>{}},expenses:{dependencies:[],init:async()=>{}},services:{dependencies:[],init:async()=>{}},staff:{dependencies:[],init:async()=>{}},suppliers:{dependencies:[],init:async()=>{}},legacy:{dependencies:[],init:async()=>{}},import:{dependencies:[],init:async()=>{}},users:{dependencies:[],init:async()=>{}},diagnostics:{dependencies:[],init:async()=>{registerHealthChecks()}},settings:{dependencies:[],init:async()=>{}}};
    for(const[name,mod]of Object.entries(modules)){pluginLoader.register(name,mod)}
    for(const name of Object.keys(modules)){await pluginLoader.load(name)}
    document.getElementById('langSelect').value=currentLang;
    applyTranslations();
    updateSidebarUser();
    buildMenu();
    navigateTo('dashboard');
    function checkMobile(){const btn=document.getElementById('mobileMenuBtn');if(window.innerWidth<=768){btn.style.display='inline-flex'}else{btn.style.display='none';document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('sidebarOverlay').classList.remove('active')}}
    window.addEventListener('resize',checkMobile);checkMobile();
    document.querySelectorAll('.modal-overlay').forEach(m=>{m.addEventListener('click',(e)=>{if(e.target===m)m.classList.remove('active')})});
    console.log('[ICON HAIR] System initialized');
    console.log('[ICON HAIR] User:',currentUser.username,'Role:',currentUser.role);
    console.log('[ICON HAIR] Users:',db.tables.users.length);
    console.log('[ICON HAIR] Modules:',pluginLoader.listActive());
  }catch(e){console.error('[ICON HAIR] Init failed:',e);document.getElementById('pageContainer').innerHTML=`<div class="alert alert-danger">System initialization failed: ${e.message}</div>`}
}

// STARTUP - Critical Fix
// ============================================================================
(function startup(){
  console.log('[ICON HAIR] Starting...');
  // Load database first
  db.load().then(()=>{
    // Ensure admin exists
    ensureAdminExists();
    console.log('[ICON HAIR] Users in DB:',db.tables.users.length);
    console.log('[ICON HAIR] Admin exists:',db.tables.users.some(u=>u.username==='admin'));
    // Update user count display
    const userCountDiv=document.getElementById('userCount');
    if(userCountDiv)userCountDiv.textContent=`${db.tables.users.length} user(s) registered`;
    // Try to restore session
    if(!restoreSession()){
      console.log('[ICON HAIR] No active session, showing login');
    }
  });
})();
</script>
