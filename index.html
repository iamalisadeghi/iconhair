<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICON HAIR - Studio & Grooming</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#6366f1;--primary-dark:#4f46e5;--secondary:#ec4899;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--bg:#f8fafc;--card:#ffffff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--sidebar-w:260px;--sidebar-collapsed:70px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.lang-bn body{font-family:'Noto Sans Bengali','Inter',sans-serif}
.lang-fa body{font-family:'Vazirmatn',sans-serif}
[dir="rtl"] body{font-family:'Vazirmatn','Noto Sans Bengali','Inter',sans-serif}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:linear-gradient(180deg,#1e1b4b 0%,#312e81 50%,#3730a3 100%);color:white;position:fixed;top:0;left:0;overflow-y:auto;overflow-x:hidden;transition:all .3s;z-index:100;display:flex;flex-direction:column}
[dir="rtl"] .sidebar{left:auto;right:0}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar.collapsed .menu-text,.sidebar.collapsed .logo-text,.sidebar.collapsed .sidebar-footer-text{display:none}
.main{margin-left:var(--sidebar-w);flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;transition:all .3s;-webkit-overflow-scrolling:touch}
[dir="rtl"] .main{margin-left:0;margin-right:var(--sidebar-w)}
.sidebar.collapsed~.main{margin-left:var(--sidebar-collapsed)}
[dir="rtl"] .sidebar.collapsed~.main{margin-left:0;margin-right:var(--sidebar-collapsed)}
.logo{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#6366f1,#ec4899);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;color:white}
.logo-text .brand{font-weight:700;font-size:14px;white-space:nowrap}
.logo-text .tagline{font-size:10px;opacity:.7;white-space:nowrap}
.menu{padding:12px 8px;flex:1}
.menu-item{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:2px 0;border-radius:10px;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.7);font-size:13px;font-weight:500;white-space:nowrap;user-select:none}
.menu-item:hover{background:rgba(255,255,255,.1);color:white}
.menu-item.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 4px 12px rgba(99,102,241,.4)}
.menu-icon{width:20px;text-align:center;font-size:16px;flex-shrink:0}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);flex-shrink:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header-title h1{font-size:22px;font-weight:700;color:var(--text)}
.header-title p{color:var(--text-light);font-size:12px;margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1px solid var(--border)}
.stat-card{background:var(--card);border-radius:14px;padding:16px;border-left:4px solid var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .2s}
[dir="rtl"] .stat-card{border-left:none;border-right:4px solid var(--primary)}
.stat-card:hover{transform:translateY(-2px)}
.stat-card.purple{border-color:#8b5cf6}.stat-card.green{border-color:#10b981}
.stat-card.orange{border-color:#f59e0b}.stat-card.pink{border-color:#ec4899}
.stat-card.blue{border-color:#3b82f6}.stat-card.red{border-color:#ef4444}
.stat-label{color:var(--text-light);font-size:12px;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:700;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text-light);margin-top:4px}
.btn{padding:8px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:13px;transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:white}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:white}
.btn-danger{background:var(--danger);color:white}
.btn-warning{background:var(--warning);color:white}
.btn-secondary{background:#e2e8f0;color:var(--text)}
.btn-sm{padding:6px 10px;font-size:11px}
.btn-icon{padding:8px;width:36px;height:36px;justify-content:center}
.form-group{margin-bottom:14px}
.form-label{display:block;margin-bottom:5px;font-weight:500;font-size:13px;color:var(--text)}
.form-control{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px;transition:all .2s;background:white;color:var(--text);font-family:inherit}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:70px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:600px}
th{background:#f1f5f9;padding:10px 12px;text-align:left;font-weight:600;font-size:12px;color:var(--text-light);border-bottom:2px solid var(--border);white-space:nowrap}
[dir="rtl"] th{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover td{background:#f8fafc}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block;white-space:nowrap}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-purple{background:#ede9fe;color:#5b21b6}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:white;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:700}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-light);padding:0 4px;line-height:1}
.lang-select{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:white;font-size:12px;cursor:pointer;font-family:inherit}
.page{display:none}.page.active{display:block}
.calendar-grid{display:grid;grid-template-columns:70px repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.calendar-cell{background:white;padding:6px;min-height:45px;font-size:11px}
.calendar-header{background:#f1f5f9;font-weight:600;text-align:center;padding:8px 4px;font-size:11px}
.calendar-time{background:#f8fafc;font-weight:500;text-align:center;font-size:10px}
.calendar-slot{cursor:pointer;transition:background .2s}
.calendar-slot:hover{background:#eef2ff}
.calendar-slot.booked{background:#dbeafe;border-left:3px solid var(--info)}
.calendar-slot.completed{background:#d1fae5;border-left:3px solid var(--success)}
.calendar-slot.cancelled{background:#fee2e2;border-left:3px solid var(--danger)}
.alert{padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:8px;animation:slideIn .3s}
.alert-success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.alert-danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.alert-warning{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.alert-info{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.invoice-box{max-width:800px;margin:0 auto;padding:30px;background:white;border-radius:12px}
.invoice-header-box{display:flex;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--primary);flex-wrap:wrap;gap:16px}
.invoice-logo{font-size:24px;font-weight:800;color:var(--primary)}
.invoice-table{width:100%;margin:16px 0}
.invoice-table th{background:var(--primary);color:white}
.invoice-total-box{text-align:right;font-size:18px;font-weight:700;margin-top:16px;padding-top:12px;border-top:2px solid var(--border)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.sidebar-overlay.active{display:block}
.diag-status{display:flex;align-items:center;gap:8px;padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--border)}
.diag-status.healthy{background:#f0fdf4;border-color:#86efac}
.diag-status.warning{background:#fffbeb;border-color:#fcd34d}
.diag-status.critical{background:#fef2f2;border-color:#fca5a5}
.diag-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.diag-dot.healthy{background:#10b981}.diag-dot.warning{background:#f59e0b}.diag-dot.critical{background:#ef4444}
.error-log{max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;background:#1e293b;color:#e2e8f0;padding:12px;border-radius:10px}
.error-log .entry{padding:6px 0;border-bottom:1px solid #334155}
.error-log .entry.error{color:#fca5a5}
.error-log .entry.warn{color:#fcd34d}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.text-center{text-align:center}
.hidden{display:none!important}
.welcome-banner{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border-radius:16px;padding:24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.welcome-banner h2{font-size:24px;font-weight:700;margin-bottom:4px}
.welcome-banner p{opacity:.9;font-size:14px}
.welcome-time{text-align:right}
.welcome-time .time{font-size:32px;font-weight:700}
.welcome-time .date{opacity:.9;font-size:13px}
.quick-customer{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);transition:background .2s}
.quick-customer:hover{background:#f8fafc}
.customer-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0}
.import-record{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:all .2s}
.import-record:hover{background:#f1f5f9}
.import-record.duplicate{border-color:var(--warning);background:#fffbeb}
.import-record.new{border-color:var(--success);background:#f0fdf4}
.import-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.import-stat{background:white;padding:14px;border-radius:10px;border-left:4px solid var(--primary);text-align:center}
.import-stat.green{border-color:var(--success)}
.import-stat.orange{border-color:var(--warning)}
.import-stat.red{border-color:var(--danger)}
.import-stat .num{font-size:22px;font-weight:700;color:var(--text)}
.import-stat .label{font-size:11px;color:var(--text-light);margin-top:4px}
.search-box{position:relative;margin-bottom:16px}
.search-box input{padding-left:40px}
[dir="rtl"] .search-box input{padding-left:12px;padding-right:40px}
.search-box .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-light)}
[dir="rtl"] .search-box .search-icon{left:auto;right:12px}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w)!important}
  [dir="rtl"] .sidebar{transform:translateX(100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .main{margin-left:0!important;padding:12px}
  [dir="rtl"] .main{margin-right:0!important}
  .sidebar.collapsed~.main{margin-left:0!important}
  [dir="rtl"] .sidebar.collapsed~.main{margin-right:0!important}
  .header-title h1{font-size:18px}
  .stat-value{font-size:20px}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .modal{padding:16px;max-height:95vh}
  .calendar-grid{grid-template-columns:60px repeat(auto-fill,minmax(100px,1fr))}
  .invoice-box{padding:16px}
  table{min-width:500px}
  .welcome-banner{flex-direction:column;text-align:center}
}
@media(max-width:480px){.grid-4{grid-template-columns:1fr 1fr}.header-actions{width:100%;justify-content:flex-end}}
@media print{.sidebar,.header-actions,.no-print,.sidebar-overlay{display:none!important}.main{margin:0!important;padding:0!important;overflow:visible}.invoice-box{box-shadow:none!important;border:none!important}body{overflow:visible;height:auto}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">IH</div>
      <div class="logo-text">
        <div class="brand">ICON HAIR</div>
        <div class="tagline" data-i18n="tagline">Studio & Grooming</div>
      </div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="sidebar-footer">
      <button class="menu-item" onclick="toggleSidebar()" style="width:100%;background:rgba(255,255,255,.05)">
        <span class="menu-icon">☰</span><span class="menu-text sidebar-footer-text" data-i18n="btn_collapse">Collapse</span>
      </button>
    </div>
  </aside>
  <main class="main" id="mainContent">
    <div class="header">
      <div class="header-title">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn btn-icon btn-secondary no-print" onclick="toggleMobileSidebar()" id="mobileMenuBtn" style="display:none">☰</button>
          <div>
            <h1 id="pageTitle" data-i18n="menu_dashboard">Dashboard</h1>
            <p id="pageSubtitle" data-i18n="subtitle_dashboard">Business overview & insights</p>
          </div>
        </div>
      </div>
      <div class="header-actions no-print">
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
          <option value="en">🇬🇧 English</option>
          <option value="bn">🇧🇩 বাংলা</option>
          <option value="fa">🇮🇷 فارسی</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="exportData()">💾 <span data-i18n="btn_backup">Backup</span></button>
      </div>
    </div>
    <div id="alertArea"></div>
    <div id="pageContainer"></div>
  </main>
</div>

<script>
// ============================================================================
// CORE
// ============================================================================
class EventBus{constructor(){this.listeners=new Map();this.log=[]}on(e,c,m){if(!this.listeners.has(e))this.listeners.set(e,new Set());this.listeners.get(e).add({callback:c,module:m||'unknown'});return()=>this.off(e,c)}emit(e,d){this.log.push({time:Date.now(),event:e,data:JSON.stringify(d).substring(0,200)});if(this.log.length>500)this.log.shift();if(this.listeners.has(e))this.listeners.get(e).forEach(({callback:c,module:m})=>{try{c(d)}catch(err){diagnostics.logError(m,e,err)}})}off(e,c){if(this.listeners.has(e)){for(const item of this.listeners.get(e)){if(item.callback===c){this.listeners.get(e).delete(item);break}}}}}
class Database{constructor(){this.tables={customers:[],appointments:[],sales:[],expenses:[],purchases:[],products:[],services:[],staff:[],suppliers:[],legacy:[],settings:{bizName:'ICON HAIR - STUDIO & GROOMING',bizPhone:'01852280080',bizAddress:'Unit B-3, Floor 3, Plot 33, La Montana Building, Gorib-e-newaz Avenue, Sector 11, Uttara, Dhaka - 1230',bizEmail:'iconhair.bd@gmail.com',invPrefix:'INV-'}}}async load(){const s=localStorage.getItem('iconhair_db_v2');if(s){try{const d=JSON.parse(s);Object.assign(this.tables,d)}catch(e){console.error(e)}}this._seed()}
_seed(){if(this.tables.services.length===0){this.tables.services=[{id:1,name:'Install new hair system',category:'Hair system',price:5000,duration:120},{id:2,name:'Hair system service - glue',category:'Hair system',price:1500,duration:60},{id:3,name:'Hair system service - clips',category:'Hair system',price:1500,duration:60},{id:4,name:'Haircut + styling',category:'Haircut & styling',price:500,duration:60},{id:5,name:'Hair styling',category:'Haircut & styling',price:400,duration:45},{id:6,name:'Beard trim',category:'Beard & face',price:200,duration:30},{id:7,name:'Facial cleansing',category:'Beard & face',price:800,duration:60}]}
if(this.tables.staff.length===0){this.tables.staff=[{id:1,name:'Staff 1',role:'Stylist',phone:'01800000000',commission:10,active:true},{id:2,name:'Staff 2',role:'Barber',phone:'01800000001',commission:10,active:true}]}
if(this.tables.products.length===0){this.tables.products=[{id:1,name:'Shampoo 250ml',category:'Hair care',unit:'bottle',openingStock:10,usedDamaged:0,sellingPrice:450,reorderLevel:3},{id:2,name:'Hair Wax',category:'Styling',unit:'jar',openingStock:8,usedDamaged:0,sellingPrice:650,reorderLevel:3},{id:3,name:'Beard Oil',category:'Grooming',unit:'bottle',openingStock:5,usedDamaged:0,sellingPrice:800,reorderLevel:2}]}
this.save()}
save(){try{localStorage.setItem('iconhair_db_v2',JSON.stringify(this.tables));eventBus.emit('db:saved',{timestamp:Date.now()})}catch(e){console.error(e)}}
getAll(t){return Array.isArray(this.tables[t])?this.tables[t]:[]}}
class PluginLoader{constructor(){this.modules=new Map();this.activeModules=new Set()}register(n,m){this.modules.set(n,{name:n,module:m,loaded:false,dependencies:m.dependencies||[]})}async load(n){const p=this.modules.get(n);if(!p)throw new Error(`Module ${n} not found`);if(p.loaded)return;for(const d of p.dependencies){if(!this.activeModules.has(d))await this.load(d)}try{if(p.module.init)await p.module.init();p.loaded=true;this.activeModules.add(n)}catch(e){console.error(e)}}listAll(){return Array.from(this.modules.keys())}listActive(){return Array.from(this.activeModules)}}
class DiagnosticsModule{constructor(){this.errors=[];this.warnings=[];this.healthChecks=[];this.startTime=Date.now()}logError(m,c,e){this.errors.push({id:Date.now(),timestamp:new Date().toISOString(),module:m,context:c,message:e?.message||String(e),severity:'error'});if(this.errors.length>200)this.errors.shift()}logWarning(m,c,msg){this.warnings.push({id:Date.now(),timestamp:new Date().toISOString(),module:m,context:c,message:msg,severity:'warning'});if(this.warnings.length>200)this.warnings.shift()}registerHealthCheck(n,f){this.healthChecks.push({name:n,check:f})}runHealthChecks(){return this.healthChecks.map(c=>{try{const r=c.check();return{name:c.name,status:r.status||'healthy',message:r.message||''}}catch(e){return{name:c.name,status:'critical',message:e.message}}})}getSystemHealth(){const c=this.runHealthChecks();const cr=c.filter(x=>x.status==='critical').length;const w=c.filter(x=>x.status==='warning').length;return{overall:cr>0?'critical':w>0?'warning':'healthy',total:c.length,critical:cr,warning:w,healthy:c.filter(x=>x.status==='healthy').length,checks:c,uptime:Date.now()-this.startTime,errorCount:this.errors.length,warningCount:this.warnings.length,dbSize:new Blob([localStorage.getItem('iconhair_db_v2')||'']).size}}getReport(){return{generatedAt:new Date().toISOString(),system:this.getSystemHealth(),errors:this.errors.slice(-50),warnings:this.warnings.slice(-50),modules:pluginLoader.listAll(),activeModules:pluginLoader.listActive(),database:{customers:db.tables.customers.length,appointments:db.tables.appointments.length,sales:db.tables.sales.length,expenses:db.tables.expenses.length,purchases:db.tables.purchases.length,products:db.tables.products.length,services:db.tables.services.length,staff:db.tables.staff.length,suppliers:db.tables.suppliers.length,legacy:db.tables.legacy.length}}}exportReport(){const b=new Blob([JSON.stringify(this.getReport(),null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`iconhair_diagnostic_${new Date().toISOString().split('T')[0]}.json`;a.click();URL.revokeObjectURL(u)}clearLogs(){this.errors=[];this.warnings=[]}}

const eventBus=new EventBus();
const db=new Database();
const pluginLoader=new PluginLoader();
const diagnostics=new DiagnosticsModule();

// ============================================================================
// UTILS
// ============================================================================
function today(){return new Date().toISOString().split('T')[0]}
function formatMoney(n){return '৳'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function formatDate(d){if(!d)return'-';return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function formatTime(t){if(!t)return'-';const[h,m]=t.split(':').map(Number);const ampm=h>=12?'PM':'AM';const h12=h%12||12;return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`}
function calcEndTime(s,d){const[h,m]=s.split(':').map(Number);const t=h*60+m+d;return `${Math.floor(t/60)%24}:${t%60}`}
function timeToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function getNextId(a){return a.length>0?Math.max(...a.map(x=>x.id))+1:1}

let currentLang=localStorage.getItem('iconhair_lang')||'en';
function t(key){return T[currentLang][key]||T.en[key]||key}
function applyTranslations(){document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(T[currentLang][k])el.textContent=T[currentLang][k]});document.documentElement.lang=currentLang;document.documentElement.dir=currentLang==='fa'?'rtl':'ltr';document.body.className=currentLang==='bn'?'lang-bn':currentLang==='fa'?'lang-fa':''}
function changeLanguage(lang){currentLang=lang;localStorage.setItem('iconhair_lang',lang);applyTranslations();renderCurrentPage();buildMenu()}

// ============================================================================
// BUSINESS LOGIC
// ============================================================================
function getStock(productId){const p=db.tables.products.find(x=>x.id===productId);if(!p)return 0;const purchased=db.tables.purchases.filter(x=>x.productId===productId).reduce((s,x)=>s+x.qty,0);const sold=db.tables.sales.filter(x=>x.type==='Product'&&x.itemId===productId).reduce((s,x)=>s+x.qty,0);return p.openingStock+purchased-sold-p.usedDamaged}
function getCustomerStats(custId){const sales=db.tables.sales.filter(x=>x.customerId===custId);const total=sales.reduce((s,x)=>s+x.total,0);const visits=sales.length;const lastVisit=sales.length>0?sales.sort((a,b)=>b.date.localeCompare(a.date))[0].date:null;return{total,visits,lastVisit}}
function getMonthlyStats(month){const prefix=month||today().substring(0,7);const sales=db.tables.sales.filter(x=>x.date.startsWith(prefix));const expenses=db.tables.expenses.filter(x=>x.date.startsWith(prefix));const purchases=db.tables.purchases.filter(x=>x.date.startsWith(prefix));const totalSales=sales.reduce((s,x)=>s+x.total,0);const totalExpenses=expenses.reduce((s,x)=>s+x.amount,0)+purchases.reduce((s,x)=>s+x.total,0);return{totalSales,totalExpenses,netProfit:totalSales-totalExpenses,salesCount:sales.length}}
function generateInvoiceNo(){const prefix=db.tables.settings.invPrefix||'INV-';const todaySales=db.tables.sales.filter(x=>x.date===today());const num=todaySales.length+1;return prefix+today().replace(/-/g,'')+'-'+num.toString().padStart(3,'0')}

function buildMenu(){const menu=document.getElementById('menu');menu.innerHTML=MENU_ITEMS.map(item=>`<div class="menu-item ${currentPage===item.id?'active':''}" data-page="${item.id}"><span class="menu-icon">${item.icon}</span><span class="menu-text">${t(item.key)}</span></div>`).join('');menu.querySelectorAll('.menu-item').forEach(item=>{item.addEventListener('click',()=>navigateTo(item.dataset.page))})}

let currentPage='dashboard';
function navigateTo(page){currentPage=page;document.querySelectorAll('.menu-item').forEach(i=>i.classList.remove('active'));const activeItem=document.querySelector(`.menu-item[data-page="${page}"]`);if(activeItem)activeItem.classList.add('active');document.getElementById('pageTitle').textContent=t('menu_'+page);renderCurrentPage();document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('sidebarOverlay').classList.remove('active')}

function renderCurrentPage(){const container=document.getElementById('pageContainer');try{switch(currentPage){case'dashboard':renderDashboard(container);break;case'calendar':renderCalendar(container);break;case'appointments':renderAppointments(container);break;case'sales':renderSales(container);break;case'invoice':renderInvoice(container);break;case'customers':renderCustomers(container);break;case'inventory':renderInventory(container);break;case'purchases':renderPurchases(container);break;case'expenses':renderExpenses(container);break;case'services':renderServices(container);break;case'staff':renderStaff(container);break;case'suppliers':renderSuppliers(container);break;case'legacy':renderLegacy(container);break;case'import':renderImport(container);break;case'diagnostics':renderDiagnostics(container);break;case'settings':renderSettings(container);break;default:container.innerHTML=`<div class="card"><p>Page not found</p></div>`}}catch(e){diagnostics.logError(currentPage,'render',e);container.innerHTML=`<div class="alert alert-danger">Error rendering ${currentPage}: ${e.message}</div>`}}

let chartSales7,chartPayment;
function renderDashboard(container){const now=new Date();const hour=now.getHours();let greeting=hour<12?t('welcome_good_morning'):hour<18?t('welcome_good_afternoon'):t('welcome_good_evening');const timeStr=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});const dateStr=now.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});const month=today().substring(0,7);const stats=getMonthlyStats(month);const todaySales=db.tables.sales.filter(x=>x.date===today()).reduce((s,x)=>s+x.total,0);const todayAppts=db.tables.appointments.filter(x=>x.date===today()&&!['Cancelled','No-show'].includes(x.status));const upcomingAppts=db.tables.appointments.filter(x=>x.date>=today()&&!['Cancelled','No-show'].includes(x.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);const lowStock=db.tables.products.filter(p=>getStock(p.id)<=p.reorderLevel&&getStock(p.id)>0);const outStock=db.tables.products.filter(p=>getStock(p.id)<=0);const recentCustomers=[...db.tables.customers].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,5);
container.innerHTML=`<div class="welcome-banner"><div><h2>${greeting}! 👋</h2><p>${db.tables.settings.bizName}</p></div><div class="welcome-time"><div class="time">${timeStr}</div><div class="date">${dateStr}</div></div></div><div class="grid-4 mb-4"><div class="stat-card purple"><div class="stat-label">${t('stat_total_sales')} (${t('this_month')})</div><div class="stat-value">${formatMoney(stats.totalSales)}</div><div class="stat-sub">${stats.salesCount} sales</div></div><div class="stat-card orange"><div class="stat-label">${t('stat_total_expenses')}</div><div class="stat-value">${formatMoney(stats.totalExpenses)}</div></div><div class="stat-card green"><div class="stat-label">${t('stat_net_profit')}</div><div class="stat-value" style="color:${stats.netProfit>=0?'var(--success)':'var(--danger)'}">${formatMoney(stats.netProfit)}</div></div><div class="stat-card blue"><div class="stat-label">${t('today_revenue')}</div><div class="stat-value">${formatMoney(todaySales)}</div><div class="stat-sub">${today().substring(8)} ${now.toLocaleDateString('en',{month:'short'})}</div></div><div class="stat-card"><div class="stat-label">${t('stat_customers')}</div><div class="stat-value">${db.tables.customers.length}</div></div><div class="stat-card pink"><div class="stat-label">${t('stat_appointments')}</div><div class="stat-value">${todayAppts.length}</div><div class="stat-sub">${t('today_appointments')}</div></div><div class="stat-card ${lowStock.length+outStock.length>0?'red':'green'}"><div class="stat-label">${t('stat_low_stock')}</div><div class="stat-value">${lowStock.length+outStock.length}</div><div class="stat-sub">${outStock.length} out of stock</div></div></div><div class="grid-2 mb-4"><div class="card"><h3 class="mb-3" style="font-weight:700;font-size:15px">${t('chart_sales_7days')}</h3><canvas id="chartSales7" height="200"></canvas></div><div class="card"><h3 class="mb-3" style="font-weight:700;font-size:15px">${t('chart_payment_methods')}</h3><canvas id="chartPayment" height="200"></canvas></div></div><div class="grid-2 mb-4"><div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('upcoming_appointments')}</h3><span class="badge badge-info">${upcomingAppts.length}</span></div><div>${upcomingAppts.length===0?`<div style="color:var(--text-light);padding:20px;text-align:center">${t('no_data')}</div>`:upcomingAppts.map(a=>{const cust=db.tables.customers.find(c=>c.id===a.customerId);const srv=db.tables.services.find(s=>s.id===a.serviceId);const stf=db.tables.staff.find(s=>s.id===a.staffId);const statusCls=a.status==='Completed'?'success':a.status==='Cancelled'?'danger':'info';return`<div class="quick-customer"><div class="customer-avatar">${(cust?.name||'?').charAt(0).toUpperCase()}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${cust?.name||'Walk-in'}</div><div style="font-size:11px;color:var(--text-light)">${srv?.name||'-'} · ${stf?.name||'-'}</div></div><div style="text-align:right"><div style="font-weight:600;font-size:12px">${formatDate(a.date)}</div><div style="font-size:11px;color:var(--text-light)">${formatTime(a.time)}</div></div><span class="badge badge-${statusCls}">${t('status_'+a.status.replace('-','_'))}</span></div>`}).join('')}</div></div><div class="card"><h3 class="mb-3" style="font-weight:700;font-size:15px">${t('recent_customers')}</h3><div>${recentCustomers.length===0?`<div style="color:var(--text-light);padding:20px;text-align:center">${t('no_data')}</div>`:recentCustomers.map(c=>{const stats=getCustomerStats(c.id);return`<div class="quick-customer"><div class="customer-avatar">${c.name.charAt(0).toUpperCase()}</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${c.name}</div><div style="font-size:11px;color:var(--text-light)">${c.phone} · ${c.area||'-'}</div></div><div style="text-align:right"><div style="font-weight:600;font-size:12px">${formatMoney(stats.total)}</div><div style="font-size:11px;color:var(--text-light)">${stats.visits} visits</div></div></div>`}).join('')}</div></div></div>${lowStock.length+outStock.length>0?`<div class="card mb-4"><h3 class="mb-3" style="font-weight:700;font-size:15px;color:var(--danger)">⚠️ ${t('low_stock_alerts')}</h3><div class="grid-2">${outStock.map(p=>`<div class="alert alert-danger"><strong>${p.name}</strong> - OUT OF STOCK</div>`).join('')}${lowStock.map(p=>`<div class="alert alert-warning"><strong>${p.name}</strong> - Only ${getStock(p.id)} ${p.unit} left</div>`).join('')}</div></div>`:''}<div class="card"><h3 class="mb-3" style="font-weight:700;font-size:15px">${t('smart_insights')}</h3><div>${renderInsights()}</div></div>`;renderDashboardCharts(month)}

function renderInsights(){const month=today().substring(0,7);const insights=[];const serviceSales={};db.tables.sales.filter(x=>x.date.startsWith(month)&&x.type==='Service').forEach(s=>{serviceSales[s.itemId]=(serviceSales[s.itemId]||0)+s.total});const topServiceId=Object.entries(serviceSales).sort((a,b)=>b[1]-a[1])[0]?.[0];const topService=db.tables.services.find(s=>s.id===topServiceId);if(topService)insights.push(`🏆 ${t('insight_best_service')}: ${topService.name} (${formatMoney(serviceSales[topServiceId])})`);const staffSales={};db.tables.sales.filter(x=>x.date.startsWith(month)&&x.staffId).forEach(s=>{staffSales[s.staffId]=(staffSales[s.staffId]||0)+s.total});const topStaffId=Object.entries(staffSales).sort((a,b)=>b[1]-a[1])[0]?.[0];const topStaff=db.tables.staff.find(s=>s.id===topStaffId);if(topStaff)insights.push(`⭐ ${t('insight_top_staff')}: ${topStaff.name} (${formatMoney(staffSales[topStaffId])})`);const winback=db.tables.customers.filter(c=>{const s=getCustomerStats(c.id);if(!s.lastVisit)return false;return Math.floor((new Date()-new Date(s.lastVisit))/86400000)>45});if(winback.length>0)insights.push(`📞 ${t('insight_winback')}: ${winback.length} ${t('stat_customers').toLowerCase()}`);if(insights.length===0)insights.push(`💡 ${t('insight_no_data')}`);return insights.map(i=>`<div style="padding:10px;border-bottom:1px solid var(--border);font-size:13px">${i}</div>`).join('')}

function renderDashboardCharts(month){const labels7=[],data7=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().split('T')[0];labels7.push(d.toLocaleDateString('en',{weekday:'short'}));data7.push(db.tables.sales.filter(x=>x.date===ds).reduce((s,x)=>s+x.total,0))}if(chartSales7)chartSales7.destroy();const ctx1=document.getElementById('chartSales7');if(ctx1){chartSales7=new Chart(ctx1,{type:'line',data:{labels:labels7,datasets:[{label:t('stat_total_sales'),data:data7,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.1)',tension:.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}const paymentData={};db.tables.sales.filter(x=>x.date.startsWith(month)).forEach(s=>{paymentData[s.payment]=(paymentData[s.payment]||0)+s.total});const payLabels=Object.keys(paymentData);const payData=Object.values(paymentData);const colors=['#6366f1','#ec4899','#10b981','#f59e0b','#3b82f6','#8b5cf6'];if(chartPayment)chartPayment.destroy();const ctx2=document.getElementById('chartPayment');if(ctx2){chartPayment=new Chart(ctx2,{type:'doughnut',data:{labels:payLabels.length?payLabels:[t('no_data')],datasets:[{data:payData.length?payData:[1],backgroundColor:colors}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}}

function renderCalendar(container){container.innerHTML=`<div class="card"><div class="flex-between mb-3" style="flex-wrap:wrap;gap:10px"><input type="date" id="calDate" class="form-control" style="width:auto;min-width:160px" value="${today()}" onchange="updateCalendar()"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="form-label" style="margin:0;font-size:12px">${t('opens')}</label><input type="time" id="calOpen" value="10:00" class="form-control" style="width:110px" onchange="updateCalendar()"><label class="form-label" style="margin:0;font-size:12px">${t('closes')}</label><input type="time" id="calClose" value="21:00" class="form-control" style="width:110px" onchange="updateCalendar()"></div></div><div id="calendarGrid" class="calendar-grid" style="overflow-x:auto"></div></div>`;updateCalendar()}
function updateCalendar(){const date=document.getElementById('calDate').value||today();const open=document.getElementById('calOpen').value||'10:00';const close=document.getElementById('calClose').value||'21:00';const openMin=timeToMin(open);const closeMin=timeToMin(close);const slotMin=30;const dayAppts=db.tables.appointments.filter(a=>a.date===date&&!['Cancelled','No-show'].includes(a.status));const staffList=db.tables.staff.filter(s=>s.active!==false);let html=`<div class="calendar-header">${t('th_time')}</div>`;staffList.forEach(s=>{html+=`<div class="calendar-header">${s.name}</div>`});for(let m=openMin;m<closeMin;m+=slotMin){const h=Math.floor(m/60),mi=m%60;const timeStr=`${h.toString().padStart(2,'0')}:${mi.toString().padStart(2,'0')}`;html+=`<div class="calendar-cell calendar-time">${formatTime(timeStr)}</div>`;staffList.forEach(s=>{const appt=dayAppts.find(a=>a.staffId===s.id&&timeToMin(a.time)<=m&&timeToMin(a.time)+a.duration>m);let cls='calendar-cell calendar-slot';let content='';if(appt){if(timeToMin(appt.time)===m){const cust=db.tables.customers.find(c=>c.id===appt.customerId);const srv=db.tables.services.find(sv=>sv.id===appt.serviceId);cls+=` ${appt.status.toLowerCase()}`;content=`<strong style="font-size:10px">${cust?.name||'-'}</strong><br><span style="font-size:9px;color:var(--text-light)">${srv?.name||''}</span>`}}html+=`<div class="${cls}">${content}</div>`})}document.getElementById('calendarGrid').innerHTML=html}

function renderAppointments(container){const sorted=[...db.tables.appointments].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));container.innerHTML=`<div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('all_appointments')}</h3><button class="btn btn-primary btn-sm" onclick="openAppointmentModal()">➕ ${t('btn_new_appointment')}</button></div><div class="table-wrap"><table><thead><tr><th>${t('th_date')}</th><th>${t('th_time')}</th><th>${t('th_customer')}</th><th>${t('th_service')}</th><th>${t('th_staff')}</th><th>${t('th_duration')}</th><th>${t('th_status')}</th><th>${t('th_actions')}</th></tr></thead><tbody>${sorted.length===0?`<tr><td colspan="8" class="text-center" style="padding:30px;color:var(--text-light)">${t('no_data')}</td></tr>`:sorted.map(a=>{const cust=db.tables.customers.find(c=>c.id===a.customerId);const srv=db.tables.services.find(s=>s.id===a.serviceId);const stf=db.tables.staff.find(s=>s.id===a.staffId);const endTime=calcEndTime(a.time,a.duration);const statusCls=a.status==='Completed'?'success':a.status==='Cancelled'?'danger':a.status==='No-show'?'warning':'info';return`<tr><td>${formatDate(a.date)}</td><td>${formatTime(a.time)}-${formatTime(endTime)}</td><td>${cust?.name||'-'}</td><td>${srv?.name||'-'}</td><td>${stf?.name||'-'}</td><td>${a.duration} min</td><td><span class="badge badge-${statusCls}">${t('status_'+a.status.replace('-','_'))}</span></td><td><button class="btn btn-sm btn-secondary" onclick="editAppointment(${a.id})">${t('edit')}</button><button class="btn btn-sm btn-danger" onclick="deleteAppointment(${a.id})">${t('delete')}</button></td></tr>`}).join('')}</tbody></table></div></div>${appointmentModalHTML()}${customerModalHTML('apt')}`}
function appointmentModalHTML(){return`<div class="modal-overlay" id="appointmentModal"><div class="modal"><div class="modal-header"><div class="modal-title">${t('new_appointment')}</div><button class="modal-close" onclick="closeModal('appointmentModal')">×</button></div><form onsubmit="saveAppointment(event)"><div class="grid-2"><div class="form-group"><label class="form-label">${t('th_customer')} *</label><div style="display:flex;gap:8px"><select id="apt_customer" class="form-control" required style="flex:1"><option value="">--</option>${db.tables.customers.map(c=>`<option value="${c.id}">${c.name} (${c.phone})</option>`).join('')}</select><button type="button" class="btn btn-success btn-sm" onclick="openModal('aptCustomerModal')" style="white-space:nowrap">${t('btn_add_customer')}</button></div></div><div class="form-group"><label class="form-label">${t('th_service')} *</label><select id="apt_service" class="form-control" required onchange="document.getElementById('apt_duration').value=this.selectedOptions[0]?.dataset.duration||60"><option value="">--</option>${db.tables.services.map(s=>`<option value="${s.id}" data-duration="${s.duration}">${s.name} (${s.duration}min)</option>`).join('')}</select></div><div class="form-group"><label class="form-label">${t('th_staff')} *</label><select id="apt_staff" class="form-control" required>${db.tables.staff.filter(s=>s.active!==false).map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">${t('th_date')} *</label><input type="date" id="apt_date" class="form-control" value="${today()}" required></div><div class="form-group"><label class="form-label">${t('th_time')} *</label><input type="time" id="apt_time" class="form-control" required></div><div class="form-group"><label class="form-label">${t('th_duration')}</label><input type="number" id="apt_duration" class="form-control" value="60" min="15" step="15" required></div><div class="form-group"><label class="form-label">${t('th_status')}</label><select id="apt_status" class="form-control"><option>Booked</option><option>Arrived</option><option>Completed</option><option>Cancelled</option><option>No-show</option></select></div><div class="form-group"><label class="form-label">${t('booked_via')}</label><select id="apt_booked_via" class="form-control"><option>Phone call</option><option>WhatsApp</option><option>Walk-in</option><option>Facebook</option><option>Instagram</option><option>Imo</option><option>Website</option><option>Referral</option></select></div></div><div class="form-group"><label class="form-label">${t('th_notes')}</label><textarea id="apt_notes" class="form-control" rows="2"></textarea></div><div id="aptClashAlert"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('appointmentModal')">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_save')}</button></div></form></div></div>`}
function customerModalHTML(prefix){return`<div class="modal-overlay" id="${prefix}CustomerModal"><div class="modal"><div class="modal-header"><div class="modal-title">${t('new_customer')}</div><button class="modal-close" onclick="closeModal('${prefix}CustomerModal')">×</button></div><form onsubmit="saveCustomerFromModal(event,'${prefix}')"><div class="grid-2"><div class="form-group"><label class="form-label">${t('th_name')} *</label><input type="text" id="${prefix}_cust_name" class="form-control" required></div><div class="form-group"><label class="form-label">${t('th_phone')} *</label><input type="text" id="${prefix}_cust_phone" class="form-control" required placeholder="01712345678"></div><div class="form-group"><label class="form-label">${t('th_birthday')}</label><input type="date" id="${prefix}_cust_birthday" class="form-control"></div><div class="form-group"><label class="form-label">${t('th_area')}</label><select id="${prefix}_cust_area" class="form-control"><option>Uttara</option><option>Abdullahpur</option><option>Tongi</option><option>Mirpur</option><option>Gulshan</option><option>Banani</option><option>Badda</option><option>Bashundhara</option><option>Dhanmondi</option><option>Mohammadpur</option><option>Old Dhaka</option><option>Gazipur</option><option>Narayanganj</option><option>Other</option></select></div><div class="form-group"><label class="form-label">${t('th_sms_consent')}</label><select id="${prefix}_cust_sms" class="form-control"><option value="No">No</option><option value="Yes">Yes</option></select></div><div class="form-group"><label class="form-label">${t('consent_source')}</label><select id="${prefix}_cust_source" class="form-control"><option>In-store form</option><option>WhatsApp</option><option>Phone call</option><option>Website</option></select></div></div><div class="form-group"><label class="form-label">${t('th_notes')}</label><textarea id="${prefix}_cust_notes" class="form-control" rows="2"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('${prefix}CustomerModal')">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_save')}</button></div></form></div></div>`}
function saveCustomerFromModal(e,prefix){e.preventDefault();const phone=document.getElementById(`${prefix}_cust_phone`).value.trim();if(db.tables.customers.find(c=>c.phone===phone)){showAlert(t('msg_error')+' Phone exists','danger');return}const newCustomer={id:getNextId(db.tables.customers),name:document.getElementById(`${prefix}_cust_name`).value,phone,birthday:document.getElementById(`${prefix}_cust_birthday`).value,area:document.getElementById(`${prefix}_cust_area`).value,smsConsent:document.getElementById(`${prefix}_cust_sms`).value,consentSource:document.getElementById(`${prefix}_cust_source`).value,notes:document.getElementById(`${prefix}_cust_notes`).value,created_at:new Date().toISOString()};db.tables.customers.push(newCustomer);db.save();closeModal(`${prefix}CustomerModal`);e.target.reset();showAlert(t('msg_saved'));if(currentPage==='appointments')renderAppointments(document.getElementById('pageContainer'));if(currentPage==='sales')renderSales(document.getElementById('pageContainer'));if(currentPage==='customers')renderCustomers(document.getElementById('pageContainer'));if(prefix==='apt'){setTimeout(()=>{const sel=document.getElementById('apt_customer');if(sel)sel.value=newCustomer.id},100)}if(prefix==='sale'){setTimeout(()=>{const sel=document.getElementById('sale_customer');if(sel)sel.value=newCustomer.id},100)}}
function openAppointmentModal(){openModal('appointmentModal')}
function editAppointment(id){const a=db.tables.appointments.find(x=>x.id===id);if(!a)return;openModal('appointmentModal');setTimeout(()=>{document.getElementById('apt_customer').value=a.customerId;document.getElementById('apt_service').value=a.serviceId;document.getElementById('apt_staff').value=a.staffId;document.getElementById('apt_date').value=a.date;document.getElementById('apt_time').value=a.time;document.getElementById('apt_duration').value=a.duration;document.getElementById('apt_status').value=a.status;document.getElementById('apt_booked_via').value=a.bookedVia||'Phone call';document.getElementById('apt_notes').value=a.notes||''},100);const form=document.querySelector('#appointmentModal form');const oldSubmit=form.onsubmit;form.onsubmit=function(ev){ev.preventDefault();db.tables.appointments=db.tables.appointments.filter(x=>x.id!==id);saveAppointment(ev);form.onsubmit=oldSubmit}}
function deleteAppointment(id){if(confirm(t('confirm_delete'))){db.tables.appointments=db.tables.appointments.filter(x=>x.id!==id);db.save();showAlert(t('msg_deleted'));renderAppointments(document.getElementById('pageContainer'))}}
function saveAppointment(e){e.preventDefault();const staffId=parseInt(document.getElementById('apt_staff').value);const date=document.getElementById('apt_date').value;const time=document.getElementById('apt_time').value;const duration=parseInt(document.getElementById('apt_duration').value);const startMin=timeToMin(time);const endMin=startMin+duration;const clash=db.tables.appointments.find(a=>a.staffId===staffId&&a.date===date&&!['Cancelled','No-show'].includes(a.status)&&timeToMin(a.time)<endMin&&timeToMin(a.time)+a.duration>startMin);if(clash){document.getElementById('aptClashAlert').innerHTML=`<div class="alert alert-warning">${t('msg_clash')}</div>`;if(!confirm(t('msg_clash')+' '+t('btn_save')+'?'))return}db.tables.appointments.push({id:getNextId(db.tables.appointments),customerId:parseInt(document.getElementById('apt_customer').value),serviceId:parseInt(document.getElementById('apt_service').value),staffId,date,time,duration,status:document.getElementById('apt_status').value,bookedVia:document.getElementById('apt_booked_via').value,notes:document.getElementById('apt_notes').value,created_at:new Date().toISOString()});db.save();closeModal('appointmentModal');e.target.reset();showAlert(t('msg_saved'));renderAppointments(document.getElementById('pageContainer'))}

function renderSales(container){const sorted=[...db.tables.sales].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));container.innerHTML=`<div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('all_sales')}</h3><button class="btn btn-primary btn-sm" onclick="openModal('saleModal')">➕ ${t('btn_new_sale')}</button></div><div class="table-wrap"><table><thead><tr><th>${t('th_invoice')}</th><th>${t('th_date')}</th><th>${t('th_customer')}</th><th>${t('th_type')}</th><th>${t('th_item')}</th><th>${t('th_staff')}</th><th>${t('th_qty')}</th><th>${t('th_total')}</th><th>${t('th_payment')}</th><th>${t('th_actions')}</th></tr></thead><tbody>${sorted.length===0?`<tr><td colspan="10" class="text-center" style="padding:30px;color:var(--text-light)">${t('no_data')}</td></tr>`:sorted.map(s=>{const cust=db.tables.customers.find(c=>c.id===s.customerId);const stf=db.tables.staff.find(x=>x.id===s.staffId);const item=s.type==='Service'?db.tables.services.find(x=>x.id===s.itemId):db.tables.products.find(x=>x.id===s.itemId);return`<tr><td><strong>${s.invoiceNo}</strong></td><td>${formatDate(s.date)}</td><td>${cust?.name||'-'}</td><td><span class="badge badge-purple">${t('type_'+s.type)}</span></td><td>${item?.name||'-'}</td><td>${stf?.name||'-'}</td><td>${s.qty}</td><td><strong>${formatMoney(s.total)}</strong></td><td>${t('payment_'+s.payment)}${s.paymentRef?'<br><small>'+s.paymentRef+'</small>':''}</td><td><button class="btn btn-sm btn-danger" onclick="deleteSale(${s.id})">${t('delete')}</button></td></tr>`}).join('')}</tbody></table></div></div>${saleModalHTML()}${customerModalHTML('sale')}`}
function saleModalHTML(){return`<div class="modal-overlay" id="saleModal"><div class="modal"><div class="modal-header"><div class="modal-title">${t('new_sale')}</div><button class="modal-close" onclick="closeModal('saleModal')">×</button></div><form onsubmit="saveSale(event)"><div class="grid-2"><div class="form-group"><label class="form-label">${t('th_customer')}</label><div style="display:flex;gap:8px"><select id="sale_customer" class="form-control" style="flex:1"><option value="">--</option>${db.tables.customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select><button type="button" class="btn btn-success btn-sm" onclick="openModal('saleCustomerModal')" style="white-space:nowrap">${t('btn_add_customer')}</button></div></div><div class="form-group"><label class="form-label">${t('th_type')} *</label><select id="sale_type" class="form-control" required onchange="updateSaleItems()"><option value="Service">Service</option><option value="Product">Product</option></select></div><div class="form-group"><label class="form-label">${t('th_item')} *</label><select id="sale_item" class="form-control" required onchange="autoFillSalePrice()"></select></div><div class="form-group"><label class="form-label">${t('th_staff')}</label><select id="sale_staff" class="form-control"><option value="">--</option>${db.tables.staff.filter(s=>s.active!==false).map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">${t('th_qty')} *</label><input type="number" id="sale_qty" class="form-control" value="1" min="1" required onchange="calcSaleTotal()"></div><div class="form-group"><label class="form-label">${t('th_unit_price')} *</label><input type="number" id="sale_price" class="form-control" step="0.01" required onchange="calcSaleTotal()"></div><div class="form-group"><label class="form-label">${t('th_discount')}</label><input type="number" id="sale_discount" class="form-control" value="0" step="0.01" onchange="calcSaleTotal()"></div><div class="form-group"><label class="form-label">${t('th_total')} *</label><input type="number" id="sale_total" class="form-control" step="0.01" readonly style="font-weight:700;font-size:16px"></div><div class="form-group"><label class="form-label">${t('th_payment')} *</label><select id="sale_payment" class="form-control" required><option>Cash</option><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Card</option><option>Bank transfer</option></select></div><div class="form-group"><label class="form-label">${t('payment_ref')}</label><input type="text" id="sale_ref" class="form-control" placeholder="TxID"></div></div><div class="form-group"><label class="form-label">${t('th_notes')}</label><textarea id="sale_notes" class="form-control" rows="2"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('saleModal')">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_save')}</button></div></form></div></div>`}
function updateSaleItems(){const type=document.getElementById('sale_type').value;const sel=document.getElementById('sale_item');if(type==='Service'){sel.innerHTML=db.tables.services.map(s=>`<option value="${s.id}" data-price="${s.price}">${s.name} - ${formatMoney(s.price)}</option>`).join('')}else{sel.innerHTML=db.tables.products.map(p=>`<option value="${p.id}" data-price="${p.sellingPrice}">${p.name} - ${formatMoney(p.sellingPrice)} (Stock: ${getStock(p.id)})</option>`).join('')}autoFillSalePrice()}
function autoFillSalePrice(){const sel=document.getElementById('sale_item');document.getElementById('sale_price').value=sel.options[sel.selectedIndex]?.dataset.price||0;calcSaleTotal()}
function calcSaleTotal(){const qty=parseFloat(document.getElementById('sale_qty').value)||1;const price=parseFloat(document.getElementById('sale_price').value)||0;const discount=parseFloat(document.getElementById('sale_discount').value)||0;document.getElementById('sale_total').value=(qty*price-discount).toFixed(2)}
function saveSale(e){e.preventDefault();const type=document.getElementById('sale_type').value;const itemId=parseInt(document.getElementById('sale_item').value);const qty=parseInt(document.getElementById('sale_qty').value);if(type==='Product'){const stock=getStock(itemId);if(qty>stock){showAlert(`${t('msg_error')} Out of stock: ${db.tables.products.find(p=>p.id===itemId).name} (${stock})`,'danger');return}}const invoiceNo=generateInvoiceNo();db.tables.sales.push({id:getNextId(db.tables.sales),invoiceNo,date:today(),customerId:parseInt(document.getElementById('sale_customer').value)||null,type,itemId,staffId:parseInt(document.getElementById('sale_staff').value)||null,qty,unitPrice:parseFloat(document.getElementById('sale_price').value),discount:parseFloat(document.getElementById('sale_discount').value)||0,total:parseFloat(document.getElementById('sale_total').value),payment:document.getElementById('sale_payment').value,paymentRef:document.getElementById('sale_ref').value,notes:document.getElementById('sale_notes').value,created_at:new Date().toISOString()});db.save();closeModal('saleModal');e.target.reset();showAlert(t('msg_saved')+' - '+invoiceNo);renderSales(document.getElementById('pageContainer'))}
function deleteSale(id){if(confirm(t('confirm_delete'))){db.tables.sales=db.tables.sales.filter(x=>x.id!==id);db.save();showAlert(t('msg_deleted'));renderSales(document.getElementById('pageContainer'))}}

function renderInvoice(container){const invoices=[...new Set(db.tables.sales.map(s=>s.invoiceNo))].sort().reverse();container.innerHTML=`<div class="card no-print mb-4"><div class="flex-between" style="flex-wrap:wrap;gap:10px"><div><label class="form-label">${t('select_invoice')}</label><select id="invoiceSelect" class="form-control" style="width:100%;max-width:300px" onchange="updateInvoice()">${invoices.length?invoices.map(i=>`<option value="${i}">${i}</option>`).join(''):`<option>${t('no_data')}</option>`}</select></div><button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ ${t('btn_print')}</button></div></div><div class="invoice-box" id="invoicePrintArea"></div>`;updateInvoice()}
function updateInvoice(){const invNo=document.getElementById('invoiceSelect').value;const lines=db.tables.sales.filter(s=>s.invoiceNo===invNo);const area=document.getElementById('invoicePrintArea');if(lines.length===0){area.innerHTML=`<div class="text-center" style="padding:40px;color:var(--text-light)">${t('no_data')}</div>`;return}const first=lines[0];const cust=db.tables.customers.find(c=>c.id===first.customerId);const stf=db.tables.staff.find(s=>s.id===first.staffId);const subtotal=lines.reduce((s,x)=>s+(x.qty*x.unitPrice),0);const discount=lines.reduce((s,x)=>s+(x.discount||0),0);const total=lines.reduce((s,x)=>s+x.total,0);area.innerHTML=`<div class="invoice-header-box"><div><div class="invoice-logo">ICON HAIR</div><div style="color:var(--text-light);font-size:12px;margin-top:4px">Studio & Grooming</div><div style="font-size:11px;margin-top:8px;color:var(--text-light)">${db.tables.settings.bizAddress}<br>📞 ${db.tables.settings.bizPhone}<br>✉️ ${db.tables.settings.bizEmail}</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:700;color:var(--primary)">INVOICE</div><div style="margin-top:12px;font-size:13px"><strong>${t('invoice_no')}:</strong> ${invNo}</div><div style="font-size:13px"><strong>${t('invoice_date')}:</strong> ${formatDate(first.date)}</div><div style="font-size:13px"><strong>${t('invoice_payment')}:</strong> ${t('payment_'+first.payment)}</div>${first.paymentRef?`<div style="font-size:13px"><strong>${t('invoice_ref')}:</strong> ${first.paymentRef}</div>`:''}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px"><div><div style="font-weight:700;color:var(--primary);margin-bottom:6px;font-size:13px">${t('invoice_from')}</div><div style="font-size:13px">${db.tables.settings.bizName}<br>${db.tables.settings.bizAddress}</div></div><div><div style="font-weight:700;color:var(--primary);margin-bottom:6px;font-size:13px">${t('invoice_to')}</div><div style="font-size:13px">${cust?.name||'Walk-in Customer'}<br>${cust?.phone||''}<br>${cust?.area||''}</div>${stf?`<div style="margin-top:8px;font-size:12px;color:var(--text-light)">${t('invoice_served_by')}: ${stf.name}</div>`:''}</div></div><table class="invoice-table"><thead><tr><th>#</th><th>${t('th_item')}</th><th>${t('th_qty')}</th><th>${t('th_unit_price')}</th><th>${t('th_discount')}</th><th style="text-align:right">${t('th_total')}</th></tr></thead><tbody>${lines.map((l,i)=>{const item=l.type==='Service'?db.tables.services.find(x=>x.id===l.itemId):db.tables.products.find(x=>x.id===l.itemId);return`<tr><td>${i+1}</td><td>${item?.name||'-'}<br><small style="color:var(--text-light)">${t('type_'+l.type)}</small></td><td>${l.qty}</td><td>${formatMoney(l.unitPrice)}</td><td>${formatMoney(l.discount||0)}</td><td style="text-align:right;font-weight:600">${formatMoney(l.total)}</td></tr>`}).join('')}</tbody></table><div class="invoice-total-box"><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px"><span>${t('invoice_subtotal')}:</span><span>${formatMoney(subtotal)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px"><span>${t('invoice_discount')}:</span><span>${formatMoney(discount)}</span></div><div style="display:flex;justify-content:space-between;font-size:20px;color:var(--primary);border-top:2px solid var(--border);padding-top:8px;margin-top:8px"><span>${t('invoice_total')}:</span><span>${formatMoney(total)}</span></div></div><div style="margin-top:30px;padding-top:16px;border-top:1px solid var(--border);text-align:center;color:var(--text-light);font-size:12px"><div style="font-weight:600;color:var(--primary);margin-bottom:6px">${t('invoice_thanks')}</div><div>${t('invoice_keep')}</div></div>`}

function renderCustomers(container){container.innerHTML=`<div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('all_customers')}</h3><button class="btn btn-primary btn-sm" onclick="openModal('customerModal')">➕ ${t('btn_new_customer')}</button></div><div class="search-box"><span class="search-icon">🔍</span><input type="text" id="customerSearch" class="form-control" placeholder="${t('search_placeholder')}" oninput="filterCustomers()"></div><div class="table-wrap"><table><thead><tr><th>${t('th_phone')}</th><th>${t('th_name')}</th><th>${t('th_area')}</th><th>${t('th_sms_consent')}</th><th>${t('th_total_spent')}</th><th>${t('th_visits')}</th><th>${t('th_last_visit')}</th><th>${t('th_actions')}</th></tr></thead><tbody id="customersBody"></tbody></table></div></div><div class="modal-overlay" id="customerModal"><div class="modal"><div class="modal-header"><div class="modal-title">${t('new_customer')}</div><button class="modal-close" onclick="closeModal('customerModal')">×</button></div><form onsubmit="saveCustomer(event)"><div class="grid-2"><div class="form-group"><label class="form-label">${t('th_name')} *</label><input type="text" id="cust_name" class="form-control" required></div><div class="form-group"><label class="form-label">${t('th_phone')} *</label><input type="text" id="cust_phone" class="form-control" required placeholder="01712345678"></div><div class="form-group"><label class="form-label">${t('th_birthday')}</label><input type="date" id="cust_birthday" class="form-control"></div><div class="form-group"><label class="form-label">${t('th_area')}</label><select id="cust_area" class="form-control"><option>Uttara</option><option>Abdullahpur</option><option>Tongi</option><option>Mirpur</option><option>Gulshan</option><option>Banani</option><option>Badda</option><option>Bashundhara</option><option>Dhanmondi</option><option>Mohammadpur</option><option>Old Dhaka</option><option>Gazipur</option><option>Narayanganj</option><option>Other</option></select></div><div class="form-group"><label class="form-label">${t('th_sms_consent')}</label><select id="cust_sms" class="form-control"><option value="No">No</option><option value="Yes">Yes</option></select></div><div class="form-group"><label class="form-label">${t('consent_source')}</label><select id="cust_source" class="form-control"><option>In-store form</option><option>WhatsApp</option><option>Phone call</option><option>Website</option></select></div></div><div class="form-group"><label class="form-label">${t('th_notes')}</label><textarea id="cust_notes" class="form-control" rows="2"></textarea></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('customerModal')">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_save')}</button></div></form></div></div>`;filterCustomers()}
function filterCustomers(){const query=(document.getElementById('customerSearch')?.value||'').toLowerCase();const tbody=document.getElementById('customersBody');if(!tbody)return;const filtered=db.tables.customers.filter(c=>!query||(c.name&&c.name.toLowerCase().includes(query))||(c.phone&&c.phone.includes(query))||(c.area&&c.area.toLowerCase().includes(query)));tbody.innerHTML=filtered.length===0?`<tr><td colspan="8" class="text-center" style="padding:30px;color:var(--text-light)">${t('no_data')}</td></tr>`:filtered.map(c=>{const stats=getCustomerStats(c.id);return`<tr><td>${c.phone}</td><td><strong>${c.name}</strong></td><td>${c.area||'-'}</td><td><span class="badge badge-${c.smsConsent==='Yes'?'success':'danger'}">${c.smsConsent}</span></td><td>${formatMoney(stats.total)}</td><td>${stats.visits}</td><td>${stats.lastVisit?formatDate(stats.lastVisit):'-'}</td><td><button class="btn btn-sm btn-danger" onclick="deleteCustomer(${c.id})">${t('delete')}</button></td></tr>`}).join('')}
function saveCustomer(e){e.preventDefault();const phone=document.getElementById('cust_phone').value.trim();if(db.tables.customers.find(c=>c.phone===phone)){showAlert(t('msg_error')+' Phone exists','danger');return}db.tables.customers.push({id:getNextId(db.tables.customers),name:document.getElementById('cust_name').value,phone,birthday:document.getElementById('cust_birthday').value,area:document.getElementById('cust_area').value,smsConsent:document.getElementById('cust_sms').value,consentSource:document.getElementById('cust_source').value,notes:document.getElementById('cust_notes').value,created_at:new Date().toISOString()});db.save();closeModal('customerModal');e.target.reset();showAlert(t('msg_saved'));renderCustomers(document.getElementById('pageContainer'))}
function deleteCustomer(id){if(confirm(t('confirm_delete'))){db.tables.customers=db.tables.customers.filter(x=>x.id!==id);db.save();showAlert(t('msg_deleted'));renderCustomers(document.getElementById('pageContainer'))}}

function renderInventory(container){container.innerHTML=`<div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('inventory_products')}</h3><button class="btn btn-primary btn-sm" onclick="openModal('productModal')">➕ ${t('btn_new_product')}</button></div><div class="table-wrap"><table><thead><tr><th>${t('th_product')}</th><th>${t('th_category')}</th><th>${t('th_unit')}</th><th>${t('th_current_stock')}</th><th>${t('th_selling_price')}</th><th>${t('th_reorder')}</th><th>${t('th_status')}</th><th>${t('th_actions')}</th></tr></thead><tbody>${db.tables.products.length===0?`<tr><td colspan="8" class="text-center" style="padding:30px;color:var(--text-light)">${t('no_data')}</td></tr>`:db.tables.products.map(p=>{const stock=getStock(p.id);let status='ok',statusCls='success';if(stock<=0){status='out';statusCls='danger'}else if(stock<=p.reorderLevel){status='low';statusCls='warning'}return`<tr><td><strong>${p.name}</strong></td><td>${p.category}</td><td>${p.unit}</td><td><strong>${stock}</strong></td><td>${formatMoney(p.sellingPrice)}</td><td>${p.reorderLevel}</td><td><span class="badge badge-${statusCls}">${t('status_'+status)}</span></td><td><button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">${t('delete')}</button></td></tr>`}).join('')}</tbody></table></div></div><div class="modal-overlay" id="productModal"><div class="modal"><div class="modal-header"><div class="modal-title">${t('new_product')}</div><button class="modal-close" onclick="closeModal('productModal')">×</button></div><form onsubmit="saveProduct(event)"><div class="grid-2"><div class="form-group"><label class="form-label">${t('th_product')} *</label><input type="text" id="prod_name" class="form-control" required></div><div class="form-group"><label class="form-label">${t('th_category')} *</label><select id="prod_category" class="form-control" required><option>Hair care</option><option>Styling</option><option>Grooming</option><option>Hair system supplies</option><option>Color</option><option>Tools & disposables</option><option>Towels & linen</option><option>Other</option></select></div><div class="form-group"><label class="form-label">${t('th_unit')} *</label><select id="prod_unit" class="form-control" required><option>pcs</option><option>bottle</option><option>tube</option><option>jar</option><option>box</option><option>pack</option><option>roll</option><option>set</option><option>ml</option><option>kg</option></select></div><div class="form-group"><label class="form-label">${t('th_opening_stock')}</label><input type="number" id="prod_stock" class="form-control" value="0" min="0"></div><div class="form-group"><label class="form-label">${t('th_selling_price')}</label><input type="number" id="prod_price" class="form-control" step="0.01" value="0"></div><div class="form-group"><label class="form-label">${t('th_reorder')}</label><input type="number" id="prod_reorder" class="form-control" value="3" min="0"></div></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onclick="closeModal('productModal')">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_save')}</button></div></form></div></div>`}
function saveProduct(e){e.preventDefault();db.tables.products.push({id:getNextId(db.tables.products),name:document.getElementById('prod_name').value,category:document.getElementById('prod_category').value,unit:document.getElementById('prod_unit').value,openingStock:parseInt(document.getElementById('prod_stock').value)||0,usedDamaged:0,sellingPrice:parseFloat(document.getElementById('prod_price').value)||0,reorderLevel:parseInt(document.getElementById('prod_reorder').value)||3,created_at:new Date().toISOString()});db.save();closeModal('productModal');e.target.reset();showAlert(t('msg_saved'));renderInventory(document.getElementById('pageContainer'))}
function deleteProduct(id){if(confirm(t('confirm_delete'))){db.tables.products=db.tables.products.filter(x=>x.id!==id);db.save();showAlert(t('msg_deleted'));renderInventory(document.getElementById('pageContainer'))}}

function parseWhatsAppData(text){
  // Split by date pattern or double newline
  const blocks=text.split(/\n(?=\d{2}-\d{2}-\d{4})|\n\n+/);
  const records=[];
  
  blocks.forEach(block=>{
    if(!block.trim())return;
    const record={
      date:'',voucherNo:'',name:'',address:'',phone:'',
      workType:'',system:'',size:'',price:0,
      dealBy:'',appointment:'',source:'',office:'',
      technician:'',token:'',totalSetting:'',evaluation:'',
      status:'Completed',notes:''
    };
    
    const lines=block.split('\n');
    let currentField='';
    let evaluationBuffer='';
    
    lines.forEach(line=>{
      line=line.trim();
      if(!line)return;
      
      // Date detection
      if(/^\d{2}-\d{2}-\d{4}$/.test(line)){
        record.date=line;
        return;
      }
      
      // Key-value parsing
      const kvMatch=line.match(/^(.+?)\s*[:]\s*(.*)$/);
      if(kvMatch){
        const key=kvMatch[1].trim().toLowerCase();
        const value=kvMatch[2].trim();
        
        if(key.includes('voucher'))record.voucherNo=value;
        else if(key==='name')record.name=value;
        else if(key==='address')record.address=value;
        else if(key.includes('ph')||key.includes('phone')||key.includes('number'))record.phone=value;
        else if(key.includes('work'))record.workType=value;
        else if(key==='system')record.system=value;
        else if(key==='size')record.size=value;
        else if(key==='price'){record.price=parseFloat(value.replace(/[^0-9.]/g,''))||0}
        else if(key.includes('deal'))record.dealBy=value;
        else if(key.includes('appointment'))record.appointment=value;
        else if(key==='source')record.source=value;
        else if(key.includes('office'))record.office=value;
        else if(key.includes('technician'))record.technician=value;
        else if(key==='token')record.token=value;
        else if(key.includes('total'))record.totalSetting=value;
        else if(key.includes('evaluation')){currentField='evaluation';evaluationBuffer=value}
        else{currentField=''}
      }else{
        // Continuation or evaluation
        if(currentField==='evaluation'){
          evaluationBuffer+=' '+line;
        }else if(line.includes('Done')||line.includes('✅')){
          record.status='Completed';
        }else{
          record.notes+=(record.notes?' ':'')+line;
        }
      }
    });
    
    if(evaluationBuffer)record.evaluation=evaluationBuffer.trim();
    if(record.name||record.phone){
      // Clean phone
      record.phone=record.phone.replace(/[^0-9+]/g,'');
      records.push(record);
    }
  });
  
  return records;
}

    if(r.phone&&db.tables.customers.find(c=>c.phone===r.phone)){duplicateCount++}

      ${isDuplicate?`<div style="margin-top:8px" class="badge badge-warning">⚠️ Duplicate phone</div>`:''}

function importAllRecords(){
  if(parsedImportRecords.length===0){showAlert(t('msg_error'),'danger');return}
  let imported=0,duplicates=0,errors=0;
  
  parsedImportRecords.forEach(r=>{
    if(!r.name&&!r.phone){errors++;return}
    if(r.phone&&db.tables.customers.find(c=>c.phone===r.phone)){duplicates++;return}
    
    // Add to customers
    db.tables.customers.push({
      id:getNextId(db.tables.customers),
      name:r.name||'Unknown',
      phone:r.phone||'',
      birthday:'',
      area:r.address||'',
      preferredLanguage:'en',
      smsConsent:'No',
      consentDate:today(),
      consentSource:'Imported - WhatsApp',
      notes:r.notes||'',
      legacyJobs:1,
      legacySpend:r.price||0,
      created_at:new Date().toISOString()
    });
    
    // Add to legacy
    db.tables.legacy.push({
      id:getNextId(db.tables.legacy),
      date:r.date||today(),
      voucherNo:r.voucherNo,
      customer:r.name||'Unknown',
      customerPhone:r.phone,
      address:r.address,
      workType:r.workType,
      system:r.system,
      size:r.size,
      price:r.price,
      dealBy:r.dealBy,
      appointment:r.appointment,
      source:r.source,
      office:r.office,
      technician:r.technician,
      token:r.token,
      totalSetting:r.totalSetting,
      evaluation:r.evaluation,
      status:r.status,
      notes:r.notes,
      created_at:new Date().toISOString()
    });
    
    imported++;
  });
  
  db.save();
  showAlert(`${t('import_success')}: ${imported} new, ${duplicates} duplicates, ${errors} errors`);
  parsedImportRecords=[];
  document.getElementById('importData').value='';
  document.getElementById('importPreviewSection').classList.add('hidden');
}

function clearImportData(){
  document.getElementById('importData').value='';
  parsedImportRecords=[];
  document.getElementById('importPreviewSection').classList.add('hidden');
}

function exportImportCSV(){
  if(parsedImportRecords.length===0){showAlert(t('msg_error'),'danger');return}
  const headers=['Date','Voucher No','Name','Phone','Address','Work Type','System','Size','Price','Deal By','Appointment','Source','Office','Technician','Token','Total Setting','Evaluation','Status'];
  const rows=parsedImportRecords.map(r=>[r.date,r.voucherNo,r.name,r.phone,r.address,r.workType,r.system,r.size,r.price,r.dealBy,r.appointment,r.source,r.office,r.technician,r.token,r.totalSetting,r.evaluation,r.status]);
  const csv=[headers.join(','),...rows.map(r=>r.map(x=>`"${(x||'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`iconhair_import_${today()}.csv`;a.click();URL.revokeObjectURL(url);
  showAlert(t('msg_saved'))
}
