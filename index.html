function renderDiagnostics(container){const health=diagnostics.getSystemHealth();const overallColor=health.overall==='healthy'?'green':health.overall==='warning'?'orange':'red';container.innerHTML=`<div class="grid-4 mb-4"><div class="stat-card ${overallColor}"><div class="stat-label">${t('diag_overall_health')}</div><div class="stat-value" style="color:var(--${overallColor==='green'?'success':overallColor==='orange'?'warning':'danger'})">${t('status_'+health.overall)}</div><div class="stat-sub">${health.total} checks</div></div><div class="stat-card blue"><div class="stat-label">${t('diag_uptime')}</div><div class="stat-value">${Math.floor(health.uptime/60000)}m</div><div class="stat-sub">${Math.floor((health.uptime%60000)/1000)}s</div></div><div class="stat-card red"><div class="stat-label">${t('diag_errors')}</div><div class="stat-value">${health.errorCount}</div></div><div class="stat-card orange"><div class="stat-label">${t('diag_warnings')}</div><div class="stat-value">${health.warningCount}</div></div><div class="stat-card purple"><div class="stat-label">${t('diag_db_size')}</div><div class="stat-value">${(health.dbSize/1024).toFixed(1)} KB</div></div></div><div class="grid-2 mb-4"><div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('diag_module_status')}</h3></div><div>${pluginLoader.listAll().map(m=>{const active=pluginLoader.activeModules.has(m);const errors=diagnostics.errors.filter(e=>e.module===m).length;return`<div class="diag-status ${errors>0?'critical':active?'healthy':'warning'}"><div class="diag-dot ${errors>0?'critical':active?'healthy':'warning'}"></div><div style="flex:1"><strong>${m}</strong><div style="font-size:11px;color:var(--text-light)">${active?'Active':'Inactive'} · ${errors} errors</div></div></div>`}).join('')}</div></div><div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('diag_health_checks')}</h3><button class="btn btn-primary btn-sm" onclick="runHealthChecks()">${t('btn_run_checks')}</button></div><div>${health.checks.map(c=>`<div class="diag-status ${c.status}"><div class="diag-dot ${c.status}"></div><div style="flex:1"><strong>${c.name}</strong><div style="font-size:11px;color:var(--text-light)">${c.message||''}</div></div></div>`).join('')}</div></div></div><div class="grid-2 mb-4"><div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('diag_error_log')}</h3><button class="btn btn-danger btn-sm" onclick="diagnostics.clearLogs();renderDiagnostics(document.getElementById('pageContainer'))">${t('btn_clear_logs')}</button></div><div class="error-log">${diagnostics.errors.length===0?'<div style="color:#94a3b8">No errors</div>':diagnostics.errors.slice(-30).reverse().map(e=>`<div class="entry error"><div style="color:#fca5a5">[${new Date(e.timestamp).toLocaleTimeString()}] ${e.module} > ${e.context}</div><div>${e.message}</div></div>`).join('')}</div></div><div class="card"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('diag_warning_log')}</h3></div><div class="error-log">${diagnostics.warnings.length===0?'<div style="color:#94a3b8">No warnings</div>':diagnostics.warnings.slice(-30).reverse().map(w=>`<div class="entry warn"><div style="color:#fcd34d">[${new Date(w.timestamp).toLocaleTimeString()}] ${w.module} > ${w.context}</div><div>${w.message}</div></div>`).join('')}</div></div></div><div class="card mb-4"><div class="flex-between mb-3"><h3 style="font-weight:700;font-size:15px">${t('diag_system_report')}</h3><button class="btn btn-primary btn-sm" onclick="diagnostics.exportReport()">📤 ${t('btn_export_report')}</button></div><div style="background:#f8fafc;padding:16px;border-radius:10px;font-family:monospace;font-size:12px;max-height:300px;overflow-y:auto"><pre>${JSON.stringify(diagnostics.getReport(),null,2)}</pre></div></div>`}
function runHealthChecks(){diagnostics.runHealthChecks();renderDiagnostics(document.getElementById('pageContainer'));showAlert('Health checks completed')}
function registerHealthChecks(){diagnostics.registerHealthCheck(t('diag_check_db'),()=>{const tables=['customers','appointments','sales','expenses','purchases','products','services','staff','suppliers','legacy'];const missing=tables.filter(t=>!Array.isArray(db.tables[t]));return{status:missing.length===0?'healthy':'critical',message:missing.length===0?'All tables exist':`Missing: ${missing.join(', ')}`}});diagnostics.registerHealthCheck(t('diag_check_stock'),()=>{const issues=db.tables.products.filter(p=>getStock(p.id)<0);return{status:issues.length===0?'healthy':'warning',message:issues.length===0?'All stock positive':`${issues.length} products with negative stock`}});diagnostics.registerHealthCheck(t('diag_check_clashes'),()=>{let clashes=0;db.tables.appointments.forEach(a=>{if(['Cancelled','No-show'].includes(a.status))return;const startMin=timeToMin(a.time);const endMin=startMin+a.duration;const clash=db.tables.appointments.find(other=>other.id!==a.id&&other.staffId===a.staffId&&other.date===a.date&&!['Cancelled','No-show'].includes(other.status)&&timeToMin(other.time)<endMin&&timeToMin(other.time)+other.duration>startMin);if(clash)clashes++});return{status:clashes===0?'healthy':'warning',message:clashes===0?'No clashes':`${clashes} clashes`}});diagnostics.registerHealthCheck(t('diag_check_orphans'),()=>{const orphanAppts=db.tables.appointments.filter(a=>!db.tables.customers.find(c=>c.id===a.customerId)).length;return{status:orphanAppts===0?'healthy':'warning',message:orphanAppts===0?'No orphans':`${orphanAppts} orphan appointments`}});diagnostics.registerHealthCheck(t('diag_check_settings'),()=>{const s=db.tables.settings;const missing=[];if(!s.bizName)missing.push('bizName');if(!s.bizPhone)missing.push('bizPhone');return{status:missing.length===0?'healthy':'warning',message:missing.length===0?'All settings complete':`Missing: ${missing.join(', ')}`}})}

function renderSettings(container){container.innerHTML=`<div class="card mb-4"><h3 style="font-weight:700;font-size:15px;margin-bottom:16px">${t('business_info')}</h3><div class="grid-2"><div class="form-group"><label class="form-label">${t('business_name')}</label><input type="text" id="setBizName" class="form-control" value="${db.tables.settings.bizName||''}"></div><div class="form-group"><label class="form-label">${t('business_phone')}</label><input type="text" id="setBizPhone" class="form-control" value="${db.tables.settings.bizPhone||''}"></div><div class="form-group" style="grid-column:1/-1"><label class="form-label">${t('business_address')}</label><input type="text" id="setBizAddress" class="form-control" value="${db.tables.settings.bizAddress||''}"></div><div class="form-group"><label class="form-label">${t('business_email')}</label><input type="email" id="setBizEmail" class="form-control" value="${db.tables.settings.bizEmail||''}"></div><div class="form-group"><label class="form-label">${t('invoice_prefix')}</label><input type="text" id="setInvPrefix" class="form-control" value="${db.tables.settings.invPrefix||'INV-'}"></div></div><button class="btn btn-primary mt-3" onclick="saveSettings()">💾 ${t('btn_save')}</button></div><div class="card"><h3 style="font-weight:700;font-size:15px;margin-bottom:16px">${t('data_management')}</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="exportData()">📤 ${t('btn_export')}</button><label class="btn btn-success btn-sm" style="cursor:pointer">📥 ${t('btn_import')}<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label><button class="btn btn-danger btn-sm" onclick="if(confirm(t('confirm_reset')))resetAllData()">🗑️ ${t('btn_reset')}</button></div></div>`}
function saveSettings(){db.tables.settings.bizName=document.getElementById('setBizName').value;db.tables.settings.bizPhone=document.getElementById('setBizPhone').value;db.tables.settings.bizAddress=document.getElementById('setBizAddress').value;db.tables.settings.bizEmail=document.getElementById('setBizEmail').value;db.tables.settings.invPrefix=document.getElementById('setInvPrefix').value;db.save();showAlert(t('msg_saved'))}
function exportData(){const dataStr=JSON.stringify(db.tables,null,2);const blob=new Blob([dataStr],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`iconhair_backup_${today()}.json`;a.click();URL.revokeObjectURL(url);showAlert(t('msg_saved'))}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(e)=>{try{const imported=JSON.parse(e.target.result);if(confirm(t('confirm_reset'))){db.tables=imported;db.save();showAlert(t('msg_saved'));renderCurrentPage()}}catch(err){showAlert(t('msg_error')+' Invalid file','danger')}};reader.readAsText(file)}
function resetAllData(){localStorage.removeItem('iconhair_db_v2');location.reload()}

    for(const[name,mod]of Object.entries(modules)){pluginLoader.register(name,mod)}

    window.addEventListener('resize',checkMobile);checkMobile();
    document.querySelectorAll('.modal-overlay').forEach(m=>{m.addEventListener('click',(e)=>{if(e.target===m)m.classList.remove('active')})});
    console.log('[ICON HAIR] System initialized successfully');
    console.log('[ICON HAIR] Modules:',pluginLoader.listActive());
  }catch(e){console.error('[ICON HAIR] Init failed:',e);document.getElementById('pageContainer').innerHTML=`<div class="alert alert-danger">System initialization failed: ${e.message}</div>`}
